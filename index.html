<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<script>try{const t=JSON.parse(localStorage.getItem('algo-visualizer:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{if(JSON.parse(localStorage.getItem('algo-visualizer:width'))==='wide')document.documentElement.setAttribute('data-width','wide')}catch(e){}
try{const w=JSON.parse(localStorage.getItem('algo-visualizer:lessonW'));if(w>0)document.documentElement.style.setProperty('--lesson-w',w+'px')}catch(e){}</script>
<title>Algorithmen-Visualizer – Algorithmen zum Anfassen</title>
<meta name="description" content="Sortieren, Suchen, Graphen und Datenstrukturen Schritt für Schritt animiert, mit Code, Zählern und Laufzeit.">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#0E6B85; --brand-ink-l:#FFFFFF; --brand-soft-l:#E0F2F7;
  --brand-d:#67E8F9; --brand-ink-d:#03242C; --brand-soft-d:#122A30;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
img.logo-mark{background:none;object-fit:contain}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.theme-btn .ic-sun,.theme-btn[aria-pressed="true"] .ic-moon{display:none}
.theme-btn[aria-pressed="true"] .ic-sun{display:block}
.width-btn .ic-narrow,.width-btn[aria-pressed="true"] .ic-wide{display:none}
.width-btn[aria-pressed="true"] .ic-narrow{display:block}
/* Unter 1280px ist „breit“ kaum breiter als normal – dann braucht es den Knopf nicht */
@media (max-width:1279px){.width-btn{display:none}}
/* Breite Ansicht: die Lektion nutzt die ganze Spalte statt 48rem */
:root[data-width="wide"] .lesson{position:relative;max-width:var(--lesson-w,none);padding-left:clamp(16px,3vw,56px);padding-right:clamp(16px,3vw,56px)}
/* Zieh-Griff am rechten Rand der Lektion – nur in der breiten Ansicht */
.lesson-grip{display:none}
:root[data-width="wide"] .lesson-grip{display:block;position:absolute;top:0;bottom:0;right:0;width:14px;cursor:ew-resize;touch-action:none}
.lesson-grip::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--line);transition:background-color .15s}
.lesson-grip span{position:sticky;top:calc(50% - 24px);display:block;width:8px;height:48px;margin-left:3px;border-radius:4px;background:var(--line-strong);transition:background-color .15s}
.lesson-grip:hover::before,.lesson-grip:focus-visible::before,.lesson-grip.is-dragging::before,.lesson-grip:hover span,.lesson-grip:focus-visible span,.lesson-grip.is-dragging span{background:var(--brand)}
.lesson-grip:focus-visible{outline-offset:0}
:root.is-resizing,:root.is-resizing *{cursor:ew-resize!important;user-select:none}
@media (max-width:1279px){:root[data-width="wide"] .lesson-grip{display:none}}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.side-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.start-grid.sisters{margin-top:12px}
.sis-ic{width:24px;height:24px;border-radius:6px;flex:none}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9375rem}
.chips a:hover{background:var(--surface-2)}
.chips a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips .ic{width:18px;height:18px}
.code{margin:0;padding:12px 14px;font:400 .8125rem/1.55 var(--font-mono);overflow-x:auto;white-space:pre;tab-size:2}
.code code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.count{margin:16px 0 0;font-weight:700;color:var(--muted);min-height:1.5em}
.table{width:100%;border-collapse:collapse;font-size:.9375rem}
.table th,.table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}
/* Seitenleiste im Stil einer Doku: Kapitel als Überschrift, Einträge darunter */
.grp{display:block;text-decoration:none}
a.grp:hover{color:var(--brand)}
a.grp[aria-current="page"]{color:var(--brand)}
.items .item{grid-template-columns:minmax(0,1fr);min-height:36px;padding:6px 12px 6px 14px}
.item code{background:none;padding:0;font-size:.875rem;font-weight:600}
.item.item-page{padding-top:10px;padding-bottom:11px}
@media (pointer:coarse){.items .item{min-height:44px;align-content:center}}
.hdr-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl)}
.hdr-link:hover{background:var(--surface-2)}
.hdr-link .ic{width:18px;height:18px}
@media (max-width:479px){.hdr-long,.hdr-link .ic{display:none}.appbar{flex-wrap:nowrap}}
.xlink::after{content:" ↗"}
a.logo{color:inherit;text-decoration:none;border-radius:var(--radius-sm);padding:2px 8px 2px 2px;margin-left:-2px}
a.logo:hover{background:var(--surface-2)}
.logo-name{display:block}
@media (max-width:479px){.logo-sub{display:none}}

/* ---------- Einträge ---------- */
:root{--tk-k:#8A2BB0;--tk-s:#1B6B40;--tk-n:#A3400B;--tk-c:#6B7280}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tk-k:#D7A8F5;--tk-s:#7BD9A1;--tk-n:#FDBA74;--tk-c:#8B95A5}}
:root[data-theme="dark"]{--tk-k:#D7A8F5;--tk-s:#7BD9A1;--tk-n:#FDBA74;--tk-c:#8B95A5}
.ca-toc{margin-top:20px;position:relative}
.ca-entry{padding:28px 0 32px;border-bottom:1px solid var(--line);scroll-margin-top:16px;position:relative}
.ca-entry.ca-hit{border:2px solid var(--brand);border-radius:var(--radius-lg);padding:22px 16px 26px;margin:12px -16px 0;box-shadow:0 0 0 4px var(--brand-soft)}
.lesson .ca-entry h2{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ca-entry h2 code{font-size:1.125rem}
.ca-sub{font:400 1rem/1.4 var(--font-body);color:var(--muted)}
.ca-desc{margin:8px 0 14px;max-width:68ch}
.ca-desc p{margin:0 0 8px}
.ca-desc p:last-child{margin-bottom:0}
.ca-vals{border:0;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0;position:relative}
.ca-vals label{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;font-size:.9375rem;font-weight:700}
.ca-vals label:hover{background:var(--surface-2)}
.ca-vals input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ca-vals code{background:none;padding:0;font-size:.8125rem}
.ca-vals label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ca-vals label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.ca-note{margin:10px 0 0;font-size:.9375rem;padding:8px 12px;border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;max-width:68ch}
.ca-codebox{border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;position:relative}
.ca-hl{background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:3px}
.ca-tip{margin:14px 0 0;padding:10px 14px;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.9375rem;max-width:68ch;position:relative}
.ca-rule{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--success);background:var(--success-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.9375rem;max-width:68ch}
.ca-links{margin:10px 0 0;font-size:.875rem;color:var(--muted)}
.ca-find{margin:8px 0 0;position:relative}
.ca-index td:first-child{font-weight:700}
.items .item{grid-template-columns:minmax(0,1fr);min-height:36px;padding:6px 12px 6px 14px}
.item .item-title{font-weight:600;font-size:.9375rem}
.btn-sm{min-height:36px;padding:0 12px;font-size:.9375rem}
.btn .ic{width:18px;height:18px}

/* Syntax-Farben */
.tk-k{color:var(--tk-k);font-weight:600}
.tk-s{color:var(--tk-s)}
.tk-n{color:var(--tk-n)}
.tk-c{color:var(--tk-c);font-style:italic}

/* ---------- run: echter Code, eigene Konsole ---------- */
.run-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface-2)}
.run-hint{font-size:.8125rem;color:var(--muted)}
.console{margin-top:10px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.console-h{margin:0;padding:6px 12px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.con-lines{list-style:none;margin:0;padding:6px 0;font:400 .8125rem/1.5 var(--font-mono);min-height:2.6em}
.con-lines:empty::before{content:attr(data-empty);display:block;padding:2px 12px;color:var(--muted);font-style:italic}
.con-lines li{display:flex;gap:10px;padding:2px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);white-space:pre-wrap;overflow-wrap:anywhere}
.con-lines li:last-child{border-bottom:0}
.con-t{flex:none;min-width:5.5ch;text-align:right;color:var(--muted)}
.con-warn{background:var(--warn-bg);color:var(--warn)}
.con-error{background:var(--danger-bg);color:var(--danger)}

/* ---------- trace: Event Loop Schritt für Schritt ---------- */
.tr{display:grid;gap:12px}
@container (min-width:44rem){.tr{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.tr-note,.tr-bar{grid-column:1/-1}}
.tr-code .code{padding:10px 0}
.tr-code .ln{display:block;padding:0 14px 0 0;border-left:4px solid transparent}
.tr-code .ln::before{content:attr(data-n);display:inline-block;width:3ch;margin-right:12px;text-align:right;color:var(--muted);opacity:.7}
.tr-code .ln.is-cur{background:var(--brand-soft);border-left-color:var(--brand)}
.tr-boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tr-box{border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:6px 8px 8px;min-height:84px;min-width:0}
.tr-box h3{margin:0 0 6px;font:700 .75rem/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tr-box ol,.tr-box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tr-stack ol{flex-direction:column-reverse}
.tr-box li{font:500 .8125rem/1.35 var(--font-mono);padding:4px 8px;border-radius:6px;background:var(--surface-2);overflow-wrap:anywhere}
.tr-box li.is-new{background:var(--brand);color:var(--brand-ink)}
.tr-out{grid-column:1/-1}
.tr-out ol{flex-direction:row;flex-wrap:wrap}
.tr-micro{border-color:color-mix(in srgb,var(--success) 45%,var(--line))}
.tr-task{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tr-note{margin:0;padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface-2);min-height:3.2em;max-width:none}
.tr-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tr-pos{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto;min-width:12ch}

/* ---------- sim: Regler rein, Ergebnis raus ---------- */
.sim-ctl{display:grid;gap:12px;margin-bottom:14px}
.sim-f{border:0;margin:0;padding:0;min-width:0}
.sim-f legend,.sim-lbl{font-weight:700;font-size:.9375rem;margin-bottom:6px;padding:0}
.sim-f .ca-vals{margin:0}
.sim-range{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px}
.sim-range .sim-lbl{grid-column:1/-1;margin:0}
.sim-range input{width:100%;accent-color:var(--brand)}
.sim-range output{font:700 .875rem/1 var(--font-mono);min-width:8ch;text-align:right}
.sim-checks{display:flex;flex-wrap:wrap;gap:0 18px}
.sim-checks .check-row{min-height:36px}
.verdict{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:10px 14px;border-radius:var(--radius-sm);font-weight:700;line-height:1.4}
.verdict .ic{margin-top:1px}
.v-ok{background:var(--success-bg);color:var(--success)}
.v-bad{background:var(--danger-bg);color:var(--danger)}
.v-warn{background:var(--warn-bg);color:var(--warn)}
.v-info{background:var(--brand-soft);color:var(--brand)}
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.pane{margin:0;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;min-width:0}
.pane figcaption{padding:6px 12px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.pane .code{white-space:pre-wrap;overflow-wrap:anywhere}
.flow{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;counter-reset:fl}
.flow li{counter-increment:fl;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1.5px solid var(--line);font-size:.9375rem}
.flow li::before{content:counter(fl);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font:700 .75rem/1 var(--font-mono)}
.flow .fl-ok{border-color:color-mix(in srgb,var(--success) 50%,var(--line))}
.flow .fl-ok::before{background:var(--success);color:var(--surface)}
.flow .fl-bad{border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.flow .fl-bad::before{background:var(--danger);color:var(--surface)}
.flow .fl-warn::before{background:var(--warn);color:var(--surface)}
.flow .fl-off{opacity:.55}
.sim-extra{margin-top:12px}

/* ---------- custom: freie Demos ---------- */
.stage{position:relative;padding:16px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--surface)}
.stage+.console{margin-top:10px}
.stage-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stage-row+.stage-row{margin-top:10px}
.meter{font:700 1.5rem/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.meter small{display:block;font:400 .8125rem/1.3 var(--font-body);color:var(--muted)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.meters>div{padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:.9375rem}
.kv dt{font-weight:700}
.kv dd{margin:0;font-family:var(--font-mono);font-size:.8125rem;overflow-wrap:anywhere}

/* ---------- Wasserfall ---------- */
/* Wasserfall: eine Zeile pro Anfrage, farbige Phasen auf einer Zeitachse */
.wf{display:grid;gap:6px;font-size:.8125rem}
.wf-row{display:grid;grid-template-columns:minmax(64px,9rem) minmax(0,1fr) auto;gap:10px;align-items:center}
.wf-lbl{font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-track{position:relative;height:18px;border-radius:4px;background:var(--surface-2)}
.wf-seg{position:absolute;top:0;bottom:0;min-width:2px}
.wf-seg:first-child{border-radius:4px 0 0 4px}
.wf-seg:last-child{border-radius:0 4px 4px 0}
.wf-t{font:600 .75rem/1 var(--font-mono);color:var(--muted);min-width:6ch;text-align:right}
.wf-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;padding:0;list-style:none;font-size:.8125rem;color:var(--muted)}
.wf-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ph-dns{background:#0E9F8E}.ph-tcp{background:#E07B00}.ph-tls{background:#8B5CF6}.ph-wait{background:#64748B}.ph-ttfb{background:#16A34A}.ph-dl{background:#2563EB}.ph-parse{background:#C026D3}.ph-exec{background:#DB2777}.ph-render{background:#CA8A04}.ph-block{background:#DC2626}
.wf-total{margin:10px 0 0;font-weight:700}


/* ---------- Algorithmen-Visualizer ---------- */
/* Farben für Zustände – im Dunkelmodus heller */
.av{--c-cmp:#D97706;--c-swp:#DC2626;--c-done:#16A34A;--c-piv:#7C3AED;--c-path:#D97706;--c-vis:color-mix(in srgb,var(--brand) 30%,var(--surface));--c-front:color-mix(in srgb,var(--brand) 60%,var(--surface));display:grid;gap:12px}
:root[data-theme="dark"] .av{--c-cmp:#FBBF24;--c-swp:#F87171;--c-done:#4ADE80;--c-piv:#C4B5FD;--c-path:#FBBF24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{--c-cmp:#FBBF24;--c-swp:#F87171;--c-done:#4ADE80;--c-piv:#C4B5FD;--c-path:#FBBF24}}

.av-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.av-row .sim-range{flex:1;min-width:160px}
.av-row .field{min-width:150px}
.av .field>label.sim-lbl{display:grid;gap:6px}
.av .field select{min-height:40px}
.vz-info:empty{display:none}
.av-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.av-btns input[type=range]{flex:1;min-width:140px}
.av-step{font:600 .875rem/1 var(--font-mono);white-space:nowrap}
.av-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8125rem;color:var(--muted)}
.av-legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--sw)}

/* Balken */
.vz-bars{display:flex;align-items:flex-end;gap:2px;height:240px;padding:10px;border-radius:var(--radius-sm);background:var(--surface-2)}
.vz-bar{flex:1;min-width:2px;background:var(--line-strong);border-radius:3px 3px 0 0;transition:height .08s linear}
.vz-bar.cmp{background:var(--c-cmp)}
.vz-bar.swp{background:var(--c-swp)}
.vz-bar.piv{background:var(--c-piv)}
.vz-bar.done{background:var(--c-done)}
.vz-bar.dim{opacity:.28}
.vz-bars.small .vz-bar{border-radius:1px 1px 0 0}

/* Zellen */
.vz-cells{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-radius:var(--radius-sm);background:var(--surface-2)}
.vz-cell{display:grid;grid-template-rows:auto auto 1.1em;justify-items:center;min-width:2.6em}
.vz-cell .v{display:grid;place-items:center;min-width:2.4em;height:2.4em;padding:0 4px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--surface);font:700 .9375rem/1 var(--font-mono)}
.vz-cell .i{font:500 .6875rem/1.4 var(--font-mono);color:var(--muted)}
.vz-cell .p{font:700 .6875rem/1.2 var(--font-mono);color:var(--brand)}
.vz-cell.cmp .v{border-color:var(--c-cmp);background:color-mix(in srgb,var(--c-cmp) 22%,var(--surface))}
.vz-cell.swp .v,.vz-cell.found .v{border-color:var(--c-done);background:color-mix(in srgb,var(--c-done) 25%,var(--surface))}
.vz-cell.piv .v{border-color:var(--c-piv);background:color-mix(in srgb,var(--c-piv) 22%,var(--surface))}
.vz-cell.win .v{border-color:var(--brand);background:var(--brand-soft)}
.vz-cell.dim{opacity:.3}
.vz-note{margin:0;min-height:2.6em;padding:8px 12px;border-radius:var(--radius-sm);border-left:4px solid var(--brand);background:var(--surface-2);font-size:.9375rem}
.vz-info{font:600 .875rem/1.4 var(--font-mono);color:var(--muted)}
.vz-code pre{margin:0}
.vz-code .ln{display:block;padding:0 6px;margin:0 -6px;border-radius:4px}
.vz-code .ln.on{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}

/* Big-O */
.bo{display:grid;gap:6px}
.bo-row{display:grid;grid-template-columns:6.5rem minmax(0,1fr) 9rem;gap:10px;align-items:center;font-size:.875rem}
.bo-row b{font-family:var(--font-mono)}
.bo-track{height:16px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bo-fill{height:100%;border-radius:4px;background:var(--brand)}
.bo-row.slow .bo-fill{background:var(--danger)}
.bo-row.mid .bo-fill{background:var(--warn)}
.bo-row span:last-child{font:600 .8125rem/1.2 var(--font-mono);text-align:right}
.bo-row small{display:block;color:var(--muted);font-weight:400}

/* Rennen */
.race{width:100%;border-collapse:collapse;font-size:.875rem}
.race th,.race td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.race td.n{font-family:var(--font-mono);text-align:right}
.race .bar{height:10px;border-radius:3px;background:var(--brand);min-width:2px}
.race tr.skip td{color:var(--muted)}

/* Stack & Queue */
.sq{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sq-box{border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:12px;display:grid;gap:10px;align-content:start}
.sq-box h4{margin:0;font:700 1rem/1.3 var(--font-display)}
.sq-stack{display:flex;flex-direction:column-reverse;gap:4px;min-height:200px;justify-content:flex-start;padding:8px;border:2px solid var(--line-strong);border-top:0;border-radius:0 0 8px 8px}
.sq-queue{display:flex;gap:4px;min-height:52px;align-items:center;padding:8px;border-top:2px solid var(--line-strong);border-bottom:2px solid var(--line-strong);overflow-x:auto}
.sq-item{display:grid;place-items:center;min-width:2.8em;height:2.4em;padding:0 8px;border-radius:6px;background:var(--brand-soft);border:1.5px solid var(--brand);font:700 .9375rem/1 var(--font-mono)}
.sq-item.top{background:var(--brand);color:var(--brand-ink)}
.sq-log{margin:0;font:500 .8125rem/1.5 var(--font-mono);color:var(--muted);min-height:1.5em}

/* Hashtabelle */
.ht{display:grid;gap:4px}
.ht-b{display:grid;grid-template-columns:3.2rem 1fr;gap:8px;align-items:center}
.ht-i{font:700 .8125rem/1 var(--font-mono);color:var(--muted);text-align:right}
.ht-chain{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;align-items:center;padding:3px 6px;border-radius:6px;background:var(--surface-2)}
.ht-chain.hot{outline:2px solid var(--brand)}
.ht-k{padding:5px 8px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--surface);font:600 .8125rem/1 var(--font-mono)}
.ht-k.new{border-color:var(--brand);background:var(--brand-soft)}
.ht-k.cmp{border-color:var(--c-cmp)}
.ht-k.hit{border-color:var(--c-done);background:color-mix(in srgb,var(--c-done) 22%,var(--surface))}
.ht-calc{margin:0;font:500 .8125rem/1.6 var(--font-mono);padding:8px 10px;border-radius:var(--radius-sm);background:var(--surface-2);overflow-x:auto;white-space:pre}

/* Bäume (SVG) */
.tree-wrap{overflow-x:auto;border-radius:var(--radius-sm);background:var(--surface-2);padding:8px}
.tree-wrap svg{display:block;margin:0 auto;max-width:none}
.tree-wrap line{stroke:var(--line-strong);stroke-width:1.5}
.tree-wrap line.hot{stroke:var(--brand);stroke-width:3}
.tree-wrap circle{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.tree-wrap circle.hot{fill:var(--brand-soft);stroke:var(--brand);stroke-width:2.5}
.tree-wrap circle.hit{fill:var(--c-done);stroke:var(--c-done)}
.tree-wrap circle.memo{fill:color-mix(in srgb,var(--c-done) 25%,var(--surface));stroke:var(--c-done)}
.tree-wrap circle.dup{fill:color-mix(in srgb,var(--c-swp) 18%,var(--surface));stroke:var(--c-swp)}
.tree-wrap circle.cmp{fill:color-mix(in srgb,var(--c-cmp) 30%,var(--surface));stroke:var(--c-cmp);stroke-width:2.5}
.tree-wrap text{fill:var(--ink);font:700 13px/1 var(--font-mono);text-anchor:middle;dominant-baseline:central}
.tree-wrap text.sm{font-size:10px}
.heap-arr{display:flex;flex-wrap:wrap;gap:3px}

/* Pfadsuche */
.pf-grid{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.pf-c{aspect-ratio:1;background:var(--surface);transition:background-color .15s}
.pf-c.wall{background:var(--ink)}
.pf-c.mud{background:color-mix(in srgb,#92400E 45%,var(--surface))}
.pf-c.vis{background:var(--c-vis)}
.pf-c.mud.vis{background:color-mix(in srgb,#92400E 40%,var(--c-vis))}
.pf-c.front{background:var(--c-front)}
.pf-c.path{background:var(--c-path)}
.pf-c.start,.pf-c.end{position:relative;background:var(--c-done)}
.pf-c.end{background:var(--c-swp)}
.pf-c.start::after,.pf-c.end::after{content:"S";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 .6875rem/1 var(--font-mono)}
.pf-c.end::after{content:"Z"}

/* Hanoi */
.hn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:200px;padding:10px;border-radius:var(--radius-sm);background:var(--surface-2)}
.hn-peg{position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding-bottom:6px;border-bottom:4px solid var(--line-strong)}
.hn-peg::before{content:"";position:absolute;bottom:0;left:50%;width:6px;height:90%;margin-left:-3px;border-radius:3px 3px 0 0;background:var(--line-strong)}
.hn-d{position:relative;height:18px;border-radius:9px;background:var(--brand)}
.hn-d.moved{background:var(--c-cmp)}

/* DP-Tabelle */
.dp-wrap{overflow-x:auto}
.dp{border-collapse:collapse;font:600 .875rem/1 var(--font-mono)}
.dp th,.dp td{width:2.3em;height:2.3em;text-align:center;border:1px solid var(--line)}
.dp th{background:var(--surface-2);color:var(--muted)}
.dp td.cur{background:var(--brand);color:var(--brand-ink)}
.dp td.src{background:color-mix(in srgb,var(--c-cmp) 30%,var(--surface))}
.dp td.path{background:color-mix(in srgb,var(--c-done) 30%,var(--surface));font-weight:800}
.dp td.empty{color:transparent}
.ops{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.ops li{padding:4px 8px;border-radius:6px;background:var(--surface-2);font:600 .8125rem/1.3 var(--font-mono)}
.ops li.k{opacity:.6}

/* Topologische Sortierung */
.tp{display:flex;flex-wrap:wrap;gap:6px}
.tp-n{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:.875rem}
.tp-n b{display:grid;place-items:center;min-width:1.5em;height:1.5em;border-radius:50%;background:var(--surface-2);font:700 .75rem/1 var(--font-mono)}
.tp-n.ready{border-color:var(--brand);background:var(--brand-soft)}
.tp-n.ready b{background:var(--brand);color:var(--brand-ink)}
.tp-n.out{opacity:.35}
.tp-n.cur{border-color:var(--c-cmp);box-shadow:0 0 0 2px var(--c-cmp)}
.tp-edges{margin:0;font-size:.8125rem;color:var(--muted);line-height:1.7}

/* Münzen */
.coins{display:flex;flex-wrap:wrap;gap:4px}

/* Breite-Umschalter: Lektion normal (48rem) oder über die ganze Spalte, wird gemerkt */
(()=>{

/* Breite ziehen: Griff am rechten Rand der Lektion, nur in der breiten Ansicht. Die Lektion ist
   zentriert, darum wächst sie beim Ziehen nach beiden Seiten – Breite = 2 × Abstand zur Mitte. */
(()=>{
  const root=document.documentElement,view=$('#view');
  const lesson=()=>$('.lesson',view);
  const min=()=>parseFloat(getComputedStyle(root).fontSize)*48;
  const max=()=>view.clientWidth;
  const clamp=w=>Math.min(max(),Math.max(min(),w));
  const set=w=>{if(w==null)root.style.removeProperty('--lesson-w');else root.style.setProperty('--lesson-w',Math.round(w)+'px')};
  const aria=()=>{const g=$('.lesson-grip',view),L=lesson();if(!g||!L)return;
    g.setAttribute('aria-valuemin',Math.round(min()));g.setAttribute('aria-valuemax',Math.round(max()));g.setAttribute('aria-valuenow',Math.round(L.getBoundingClientRect().width))};
  // An den Rand gezogen heißt „ganze Breite“ – dann wächst die Lektion auch mit dem Fenster mit
  const commit=w=>{const full=w>=max()-1;set(full?null:w);store.set('lessonW',full?null:Math.round(w));aria()};
  function attach(){
    const L=lesson();if(!L||$('.lesson-grip',L))return;
    const g=document.createElement('div');
    g.className='lesson-grip';g.tabIndex=0;g.setAttribute('role','separator');g.setAttribute('aria-orientation','vertical');
    g.setAttribute('aria-label',tx('Breite der Lektion','Lesson width'));
    g.title=tx('Ziehen ändert die Breite · Doppelklick: ganze Breite','Drag to resize · double-click: full width');
    g.innerHTML='<span></span>';L.append(g);aria();
  }
  view.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.lesson-grip');if(!g||e.button!==0)return;
    e.preventDefault();
    const r=lesson().getBoundingClientRect(),cx=r.left+r.width/2;
    g.setPointerCapture(e.pointerId);g.classList.add('is-dragging');root.classList.add('is-resizing');
    const move=ev=>set(clamp(2*(ev.clientX-cx)));
    const up=()=>{g.removeEventListener('pointermove',move);g.classList.remove('is-dragging');root.classList.remove('is-resizing');commit(lesson().getBoundingClientRect().width)};
    g.addEventListener('pointermove',move);g.addEventListener('lostpointercapture',up,{once:true});
  });
  view.addEventListener('dblclick',e=>{if(e.target.closest('.lesson-grip'))commit(max())});
  view.addEventListener('keydown',e=>{
    if(!e.target.classList.contains('lesson-grip'))return;
    const w=lesson().getBoundingClientRect().width,step=e.shiftKey?160:40;
    const next={ArrowLeft:w-step,ArrowRight:w+step,Home:min(),End:max()}[e.key];
    if(next!=null){e.preventDefault();e.stopPropagation();commit(clamp(next))}
  });
  view.addEventListener('focusin',e=>{if(e.target.classList.contains('lesson-grip'))aria()});
  new MutationObserver(attach).observe(view,{childList:true});attach();
})();

/* ---------- Toasts ---------- */
const toastBox=$('#toasts');
let activeUndo=null;
function announce(text,assertive){
  const r=$(assertive?'#live-assert':'#live-polite');
  r.textContent='';
  setTimeout(()=>{r.textContent=text},60);
}
function toast({msg,type='info',action,duration}){
  duration=duration??(action?8000:5000);
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;
  $('.toast-msg',t).textContent=msg;
  let actionBtn=null;
  if(action){
    actionBtn=document.createElement('button');
    actionBtn.type='button';actionBtn.className='toast-action';actionBtn.textContent=action.label;
    t.append(actionBtn);
  }
  const closeBtn=document.createElement('button');
  closeBtn.type='button';closeBtn.className='icon-btn';closeBtn.setAttribute('aria-label',tx('Meldung schließen','Close message'));closeBtn.innerHTML=ic('x');
  t.append(closeBtn);
  const timer=document.createElement('span');
  timer.className='toast-timer';timer.style.animationDuration=duration+'ms';
  t.append(timer);
  toastBox.append(t);
  while(toastBox.children.length>3) toastBox.firstElementChild.remove();

  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function pause(){clearTimeout(id);remaining-=Date.now()-start}
  function resume(){start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))}
  function close(){
    if(closed)return;closed=true;clearTimeout(id);
    if(activeUndo&&activeUndo.toast===t) activeUndo=null;
    const hadFocus=t.contains(document.activeElement);
    const done=()=>{t.remove();if(hadFocus) focusMainHeading()};
    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',pause);
  t.addEventListener('mouseleave',()=>{if(!t.contains(document.activeElement))resume()});
  t.addEventListener('focusin',pause);
  t.addEventListener('focusout',e=>{if(!t.contains(e.relatedTarget)&&!t.matches(':hover'))resume()});
  closeBtn.addEventListener('click',close);
  if(action){
    const run=()=>{action.fn();close()};
    actionBtn.addEventListener('click',run);
    activeUndo={toast:t,run};
  }
  announce(msg+(action?` ${action.label} ${tx('mit Strg plus Z','with Ctrl plus Z')}.`:''),type==='error');
  return close;
}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

function codeLines(code){
  const map={},clean=code.split('\n').map((l,i)=>{const m=/\s*\/\/@(\w+)\s*$/.exec(l);if(m){map[m[1]]??=i;return l.slice(0,m.index)}return l});
  return {map,html:hlJS(clean.join('\n')).split('\n').map((l,i)=>`<span class="ln" data-l="${i}">${l||' '}</span>`).join('')};
}

/* ---------- Rekorder: Algorithmus läuft einmal komplett, jeder Schritt wird als Bild gespeichert ---------- */
function recorder(arr){
  const a=arr.slice(),F=[],done=new Set();let cmp=0,wr=0;
  const r={a,F,ptr:{},range:null,info:'',
    snap(line,marks={},note=''){F.push({a:a.slice(),m:marks,line,cmp,wr,done:[...done],note,ptr:{...r.ptr},range:r.range?r.range.slice():null,info:r.info});if(F.length>40000)throw new Error('zu viele Schritte')},
    cmp(i,j,line,note){cmp++;r.snap(line,{[i]:'cmp',[j]:'cmp'},note);return a[i]-a[j]},
    count(n=1){cmp+=n},
    swap(i,j,line,note){wr+=2;[a[i],a[j]]=[a[j],a[i]];r.snap(line,{[i]:'swp',[j]:'swp'},note)},
    set(i,v,line,marks,note){wr++;a[i]=v;r.snap(line,{[i]:'swp',...marks},note)},
    done(...is){is.forEach(i=>done.add(i))},
    finish(note){for(let i=0;i<a.length;i++)done.add(i);r.range=null;r.ptr={};r.snap(null,{},note)}
  };
  return r;
}
function makeData(n,preset){
  const a=Array.from({length:n},(_,i)=>Math.round(6+i*94/Math.max(1,n-1)));
  if(preset==='sorted')return a;
  if(preset==='reversed')return a.reverse();
  if(preset==='nearly'){for(let k=0;k<Math.max(1,n/10);k++){const i=rnd(0,n-2);[a[i],a[i+1]]=[a[i+1],a[i]]}return a}
  if(preset==='few')return shuffle(a.map(v=>[25,50,75,100][Math.floor(v/26)]||100));
  return shuffle(a);
}

/* ---------- Sortier-Algorithmen für den Player ---------- */
const BUBBLE=`for (let end = a.length - 1; end > 0; end--) {   //@outer
  let swapped = false;
  for (let i = 0; i < end; i++) {
    if (a[i] > a[i + 1]) {                        //@cmp
      [a[i], a[i + 1]] = [a[i + 1], a[i]];        //@swap
      swapped = true;
    }
  }
  if (!swapped) break;                            //@early
}`;
const SELECTION=`for (let i = 0; i < a.length - 1; i++) {
  let min = i;                                    //@min
  for (let j = i + 1; j < a.length; j++) {
    if (a[j] < a[min]) min = j;                   //@cmp
  }
  [a[i], a[min]] = [a[min], a[i]];                //@swap
}`;
const INSERTION=`for (let i = 1; i < a.length; i++) {
  const x = a[i];                                 //@take
  let j = i - 1;
  while (j >= 0 && a[j] > x) {                    //@cmp
    a[j + 1] = a[j];                              //@shift
    j--;
  }
  a[j + 1] = x;                                   //@insert
}`;
const MERGE=`function sort(lo, hi) {
  if (lo >= hi) return;
  const mid = (lo + hi) >> 1;                     //@split
  sort(lo, mid);
  sort(mid + 1, hi);
  merge(lo, mid, hi);
}
function merge(lo, mid, hi) {
  const left = a.slice(lo, mid + 1);              //@copy
  const right = a.slice(mid + 1, hi + 1);
  let i = 0, j = 0, k = lo;
  while (i < left.length && j < right.length) {
    a[k++] = left[i] <= right[j] ? left[i++] : right[j++];   //@cmp
  }
  while (i < left.length) a[k++] = left[i++];     //@restl
  while (j < right.length) a[k++] = right[j++];   //@restr
}`;
const QUICK=`function sort(lo, hi) {
  if (lo >= hi) return;
  const p = partition(lo, hi);
  sort(lo, p - 1);
  sort(p + 1, hi);
}
function partition(lo, hi) {
  choosePivot(lo, hi);   // ${tx('Pivot wählen und nach hi tauschen','pick a pivot and swap it to hi')}   //@choose
  const pivot = a[hi];
  let i = lo;
  for (let j = lo; j < hi; j++) {
    if (a[j] < pivot) {                           //@cmp
      [a[i], a[j]] = [a[j], a[i]];                //@swap
      i++;
    }
  }
  [a[i], a[hi]] = [a[hi], a[i]];                  //@place
  return i;
}`;
const HEAP=`for (let i = (n >> 1) - 1; i >= 0; i--) siftDown(i, n);   //@build
for (let end = n - 1; end > 0; end--) {
  [a[0], a[end]] = [a[end], a[0]];                //@swap
  siftDown(0, end);
}
function siftDown(i, size) {
  while (true) {
    let big = i, l = 2 * i + 1, r = l + 1;
    if (l < size && a[l] > a[big]) big = l;       //@cmpl
    if (r < size && a[r] > a[big]) big = r;       //@cmpr
    if (big === i) return;                        //@stop
    [a[i], a[big]] = [a[big], a[i]];              //@sift
    i = big;
  }
}`;
const SHELL=`for (let gap = a.length >> 1; gap > 0; gap >>= 1) {   //@gap
  for (let i = gap; i < a.length; i++) {
    const x = a[i];
    let j = i;
    while (j >= gap && a[j - gap] > x) {          //@cmp
      a[j] = a[j - gap];                          //@shift
      j -= gap;
    }
    a[j] = x;                                     //@insert
  }
}`;
const COUNTING=`const max = Math.max(...a);
const count = new Array(max + 1).fill(0);
for (const x of a) count[x]++;                    //@count
let k = 0;
for (let v = 0; v <= max; v++) {
  while (count[v]-- > 0) a[k++] = v;              //@write
}`;

const SORTS={
 bubble(r,a){const n=a.length;for(let end=n-1;end>0;end--){let sw=false;r.range=[0,end];for(let i=0;i<end;i++){if(r.cmp(i,i+1,'cmp')>0){r.swap(i,i+1,'swap');sw=true}}r.done(end);r.snap('outer',{},tx(`Durchlauf fertig: Das größte Element bis Position ${end} ist ganz nach rechts „aufgestiegen“.`,`Pass done: the largest element up to position ${end} has “bubbled up” to the right.`));if(!sw){r.snap('early',{},tx('Kein einziger Tausch in diesem Durchlauf – die Liste ist sortiert, wir hören früh auf.','Not a single swap in this pass – the list is sorted, we stop early.'));break}}},
 selection(r,a){const n=a.length;for(let i=0;i<n-1;i++){let min=i;r.range=[i,n-1];r.snap('min',{[i]:'piv'},tx(`Suche das Minimum ab Position ${i}.`,`Find the minimum from position ${i}.`));for(let j=i+1;j<n;j++){r.count();if(a[j]<a[min]){min=j;r.snap('cmp',{[j]:'piv'},tx(`Neues Minimum: ${a[j]}`,`New minimum: ${a[j]}`))}else r.snap('cmp',{[j]:'cmp',[min]:'piv'})}if(min!==i)r.swap(i,min,'swap',tx(`Minimum ${a[min]} an Position ${i} tauschen.`,`Swap minimum ${a[min]} into position ${i}.`));r.done(i)}},
 insertion(r,a){const n=a.length;r.done(0);for(let i=1;i<n;i++){const x=a[i];r.range=[0,i];r.snap('take',{[i]:'piv'},tx(`Nimm ${x} und füge es links an der richtigen Stelle ein.`,`Take ${x} and insert it at the right place on the left.`));let j=i-1;while(j>=0){r.count();r.snap('cmp',{[j]:'cmp'});if(a[j]<=x)break;r.set(j+1,a[j],'shift',{},tx(`${a[j]} > ${x}: eins nach rechts schieben.`,`${a[j]} > ${x}: shift one to the right.`));j--}r.set(j+1,x,'insert',{},tx(`${x} an Position ${j+1} einsetzen.`,`Put ${x} at position ${j+1}.`));for(let q=0;q<=i;q++)r.done(q)}},
 merge(r,a){
  const sort=(lo,hi)=>{if(lo>=hi)return;const mid=(lo+hi)>>1;r.range=[lo,hi];r.snap('split',{},tx(`Teile [${lo}…${hi}] in zwei Hälften.`,`Split [${lo}…${hi}] into two halves.`));sort(lo,mid);sort(mid+1,hi);merge(lo,mid,hi)};
  const merge=(lo,mid,hi)=>{r.range=[lo,hi];const L=a.slice(lo,mid+1),Rr=a.slice(mid+1,hi+1);r.snap('copy',{},tx(`Füge [${lo}…${mid}] und [${mid+1}…${hi}] zusammen – beide sind schon sortiert.`,`Merge [${lo}…${mid}] and [${mid+1}…${hi}] – both are already sorted.`));let i=0,j=0,k=lo;
   while(i<L.length&&j<Rr.length){r.count();const v=L[i]<=Rr[j]?L[i++]:Rr[j++];r.set(k++,v,'cmp')}
   while(i<L.length)r.set(k++,L[i++],'restl');while(j<Rr.length)r.set(k++,Rr[j++],'restr');if(lo===0&&hi===a.length-1)r.done(...a.keys())};
  sort(0,a.length-1);
 },
 quick(r,a,o){
  const choose=(lo,hi)=>{let p=hi;if(o.pivot==='random')p=rnd(lo,hi);else if(o.pivot==='median'){const m=(lo+hi)>>1;const c=[[a[lo],lo],[a[m],m],[a[hi],hi]].sort((x,y)=>x[0]-y[0]);r.count(3);p=c[1][1]}if(p!==hi)r.swap(p,hi,'choose',tx(`Pivot ${a[p]} nach rechts tauschen.`,`Swap pivot ${a[p]} to the right.`))};
  const part=(lo,hi)=>{choose(lo,hi);const pv=a[hi];let i=lo;r.snap('choose',{[hi]:'piv'},tx(`Pivot ist ${pv}: Alles Kleinere kommt nach links.`,`Pivot is ${pv}: everything smaller goes to the left.`));
   for(let j=lo;j<hi;j++){r.ptr={i,j};r.count();r.snap('cmp',{[j]:'cmp',[hi]:'piv'});if(a[j]<pv){if(i!==j)r.swap(i,j,'swap');i++}}
   r.ptr={};if(i!==hi)r.swap(i,hi,'place',tx(`Pivot ${pv} an seinen endgültigen Platz ${i}.`,`Pivot ${pv} to its final place ${i}.`));r.done(i);return i};
  const sort=(lo,hi)=>{if(lo>hi)return;if(lo===hi){r.done(lo);return}r.range=[lo,hi];const p=part(lo,hi);sort(lo,p-1);sort(p+1,hi)};
  sort(0,a.length-1);
 },
 heap(r,a){
  const n=a.length;
  const sift=(i,size)=>{for(;;){let big=i;const l=2*i+1,rr=l+1;if(l<size){if(r.cmp(l,big,'cmpl')>0)big=l}if(rr<size){if(r.cmp(rr,big,'cmpr')>0)big=rr}if(big===i){r.snap('stop',{[i]:'piv'});return}r.swap(i,big,'sift',tx('Kind ist größer: hochtauschen, damit der Größte oben bleibt.','Child is bigger: swap up so the largest stays on top.'));i=big}};
  r.range=[0,n-1];for(let i=(n>>1)-1;i>=0;i--){r.snap('build',{[i]:'piv'},tx(`Heap aufbauen: Knoten ${i} nach unten sinken lassen.`,`Building the heap: sift node ${i} down.`));sift(i,n)}
  for(let end=n-1;end>0;end--){r.swap(0,end,'swap',tx(`Das Maximum (Wurzel) ans Ende ${end}.`,`Move the maximum (root) to the end ${end}.`));r.done(end);r.range=[0,end-1];sift(0,end)}r.done(0);
 },
 shell(r,a){const n=a.length;for(let gap=n>>1;gap>0;gap>>=1){r.snap('gap',{},tx(`Abstand ${gap}: Elemente mit diesem Abstand werden per Insertion Sort sortiert.`,`Gap ${gap}: elements this far apart are insertion sorted.`));for(let i=gap;i<n;i++){const x=a[i];let j=i;while(j>=gap){r.count();r.snap('cmp',{[j-gap]:'cmp',[i]:'piv'});if(a[j-gap]<=x)break;r.set(j,a[j-gap],'shift');j-=gap}if(j!==i)r.set(j,x,'insert')}}},
 counting(r,a){const max=Math.max(...a),c=new Array(max+1).fill(0);a.forEach((x,i)=>{c[x]++;r.info=tx(`Zähler für ${x}: ${c[x]}`,`count for ${x}: ${c[x]}`);r.snap('count',{[i]:'cmp'})});let k=0;for(let v=0;v<=max;v++){while(c[v]-->0){r.info=tx(`Schreibe ${v}`,`writing ${v}`);r.set(k++,v,'write')}}r.info=tx(`Kein einziger Vergleich – nur gezählt. Dafür ein Hilfsarray der Größe ${max+1}.`,`Not a single comparison – just counting. In exchange a helper array of size ${max+1}.`)}
};
const sortEntry=(id,title,sub,code,keys,desc,extra={})=>V({id,cat:'sorting',title,sub,kind:'custom',view:'bars',code,keys,desc,sizes:[6,80,extra.n||28],run:(r,a,o)=>{SORTS[id](r,a,o);r.finish(tx('Sortiert.','Sorted.'))},...extra});

/* ---------- Echte Implementierungen fürs Rennen (zählen nur Vergleiche) ---------- */
const RACE={
 bubble(a,lt){const n=a.length;for(let e=n-1;e>0;e--){let s=false;for(let i=0;i<e;i++)if(lt(a[i+1],a[i])){[a[i],a[i+1]]=[a[i+1],a[i]];s=true}if(!s)break}},
 selection(a,lt){const n=a.length;for(let i=0;i<n-1;i++){let m=i;for(let j=i+1;j<n;j++)if(lt(a[j],a[m]))m=j;[a[i],a[m]]=[a[m],a[i]]}},
 insertion(a,lt){for(let i=1;i<a.length;i++){const x=a[i];let j=i-1;while(j>=0&&lt(x,a[j])){a[j+1]=a[j];j--}a[j+1]=x}},
 shell(a,lt){for(let g=a.length>>1;g>0;g>>=1)for(let i=g;i<a.length;i++){const x=a[i];let j=i;while(j>=g&&lt(x,a[j-g])){a[j]=a[j-g];j-=g}a[j]=x}},
 merge(a,lt){const t=a.slice();const s=(lo,hi)=>{if(hi-lo<1)return;const m=(lo+hi)>>1;s(lo,m);s(m+1,hi);for(let k=lo;k<=hi;k++)t[k]=a[k];let i=lo,j=m+1;for(let k=lo;k<=hi;k++){if(i>m)a[k]=t[j++];else if(j>hi)a[k]=t[i++];else if(lt(t[j],t[i]))a[k]=t[j++];else a[k]=t[i++]}};s(0,a.length-1)},
 quick(a,lt){const s=(lo,hi)=>{while(lo<hi){const p=lo+((hi-lo)>>1);[a[p],a[hi]]=[a[hi],a[p]];const pv=a[hi];let i=lo;for(let j=lo;j<hi;j++)if(lt(a[j],pv)){[a[i],a[j]]=[a[j],a[i]];i++}[a[i],a[hi]]=[a[hi],a[i]];if(i-lo<hi-i){s(lo,i-1);lo=i+1}else{s(i+1,hi);hi=i-1}}};s(0,a.length-1)},
 heap(a,lt){const n=a.length;const d=(i,z)=>{for(;;){let b=i;const l=2*i+1,r=l+1;if(l<z&&lt(a[b],a[l]))b=l;if(r<z&&lt(a[b],a[r]))b=r;if(b===i)return;[a[i],a[b]]=[a[b],a[i]];i=b}};for(let i=(n>>1)-1;i>=0;i--)d(i,n);for(let e=n-1;e>0;e--){[a[0],a[e]]=[a[e],a[0]];d(0,e)}},
 native(a,lt){a.sort((x,y)=>lt(x,y)?-1:lt(y,x)?1:0)}
};
const RACE_NAMES={bubble:'Bubble Sort',selection:'Selection Sort',insertion:'Insertion Sort',shell:'Shell Sort',merge:'Merge Sort',quick:tx('Quicksort (Pivot Mitte)','Quicksort (middle pivot)'),heap:'Heap Sort',native:'Array.prototype.sort'};
const QUAD=['bubble','selection','insertion'];

/* ---------- Big-O ---------- */
const BIGO=[['O(1)',()=>1,tx('Array-Zugriff a[i], Map.get','array access a[i], Map.get')],['O(log n)',n=>Math.max(1,Math.log2(n)),tx('Binäre Suche','binary search')],['O(n)',n=>n,tx('eine Schleife, includes()','one loop, includes()')],['O(n log n)',n=>n*Math.max(1,Math.log2(n)),tx('gutes Sortieren','good sorting')],['O(n²)',n=>n*n,tx('Schleife in Schleife, Bubble Sort','loop inside loop, bubble sort')],['O(2ⁿ)',n=>Math.pow(2,n),tx('alle Teilmengen, naive Fibonacci','all subsets, naive Fibonacci')]];
function dur(ops){const s=ops/1e8;if(!isFinite(s)||s>3.15e7*1e6)return tx('länger als das Universum alt ist','longer than the age of the universe');if(s<1e-6)return '< 1 µs';if(s<1e-3)return (s*1e6).toFixed(0)+' µs';if(s<1)return (s*1e3).toFixed(s<0.01?1:0)+' ms';if(s<60)return s.toFixed(1)+' s';if(s<3600)return (s/60).toFixed(0)+' min';if(s<86400)return (s/3600).toFixed(1)+' h';if(s<3.15e7)return (s/86400).toFixed(0)+tx(' Tage',' days');return num(Math.round(s/3.15e7))+tx(' Jahre',' years')}

/* ---------- Pfadsuche ---------- */
class MinHeap{constructor(){this.h=[]}get size(){return this.h.length}push(x,p){const h=this.h;h.push([p,x]);let i=h.length-1;while(i>0){const q=(i-1)>>1;if(h[q][0]<=p)break;[h[i],h[q]]=[h[q],h[i]];i=q}}pop(){const h=this.h,top=h[0],last=h.pop();if(h.length){h[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<h.length&&h[l][0]<h[m][0])m=l;if(r<h.length&&h[r][0]<h[m][0])m=r;if(m===i)break;[h[i],h[m]]=[h[m],h[i]];i=m}}return top[1]}}
function pathfind(alg,W,H,cells,s,e){
  const cost=i=>cells[i]==='mud'?5:1,nb=i=>{const x=i%W,y=(i/W)|0,o=[];if(y>0)o.push(i-W);if(x<W-1)o.push(i+1);if(y<H-1)o.push(i+W);if(x>0)o.push(i-1);return o.filter(j=>cells[j]!=='wall')};
  const hh=i=>Math.abs(i%W-e%W)+Math.abs(((i/W)|0)-((e/W)|0));
  const order=[],prev=new Map([[s,-1]]),dist=new Map([[s,0]]);
  if(alg==='bfs'||alg==='dfs'){
    const q=[s];
    while(q.length){const c=alg==='bfs'?q.shift():q.pop();if(alg==='dfs'){if(order.includes(c))continue}order.push(c);if(c===e)break;
     const ns=nb(c);if(alg==='dfs')ns.reverse();for(const n of ns){if(alg==='bfs'){if(!prev.has(n)){prev.set(n,c);q.push(n)}}else if(!order.includes(n)){prev.set(n,c);q.push(n)}}}
  }else{
    const pq=new MinHeap(),closed=new Set();pq.push(s,0);
    while(pq.size){const c=pq.pop();if(closed.has(c))continue;closed.add(c);order.push(c);if(c===e)break;
     for(const n of nb(c)){const g=dist.get(c)+cost(n);if(alg==='greedy'){if(!prev.has(n)){prev.set(n,c);dist.set(n,g);pq.push(n,hh(n))}}else if(g<(dist.get(n)??Infinity)){dist.set(n,g);prev.set(n,c);pq.push(n,alg==='astar'?g+hh(n)*1.0001:g)}}}
  }
  let path=[];if(order.includes(e)){for(let c=e;c!==-1;c=prev.get(c))path.unshift(c)}
  const pc=path.slice(1).reduce((t,i)=>t+cost(i),0);
  return {order,path,cost:pc};
}

/* ---------- Bäume zeichnen ---------- */
function treeSVG(nodes,edges,cls={},ecls={}){
  // nodes: [{id,x,y,label,sub}] in Rasterkoordinaten
  if(!nodes.length)return `<p class="ca-note" style="margin:8px">${tx('Leer.','Empty.')}</p>`;
  const DX=40,DY=56,R=16,maxX=Math.max(...nodes.map(n=>n.x)),maxY=Math.max(...nodes.map(n=>n.y)),w=(maxX+1)*DX+20,h=(maxY+1)*DY+10;
  const P=Object.fromEntries(nodes.map(n=>[n.id,[n.x*DX+DX/2+10,n.y*DY+R+8]]));
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${tx('Baum','Tree')}">${edges.map(([a,b])=>`<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" class="${ecls[a+'-'+b]||''}"/>`).join('')}${nodes.map(n=>`<circle cx="${P[n.id][0]}" cy="${P[n.id][1]}" r="${R}" class="${cls[n.id]||''}"/><text x="${P[n.id][0]}" y="${P[n.id][1]}" class="${String(n.label).length>2?'sm':''}">${esc(String(n.label))}</text>`).join('')}</svg>`;
}

V({id:'linear',cat:'searching',title:tx('Lineare Suche','Linear search'),sub:'O(n)',view:'cells',keys:'linear search sequential includes indexof',sizes:[6,30,16],
 desc:tx('<p>Von vorne nach hinten, bis der Wert gefunden ist. Funktioniert immer, auch unsortiert – im schlimmsten Fall wird jedes Element angeschaut. Genau das machen <code>includes</code>, <code>indexOf</code> und <code>find</code>.</p>','<p>From front to back until the value is found. Always works, even unsorted – in the worst case every element is looked at. That’s exactly what <code>includes</code>, <code>indexOf</code> and <code>find</code> do.</p>'),
 opts:[{k:'target',type:'number',label:tx('Gesucht','Target'),def:42}],
 data:n=>shuffle(Array.from({length:n},(_,i)=>i*3+rnd(0,2))).map((v,i)=>i===Math.floor(n*0.7)?42:v),
 code:`for (let i = 0; i < a.length; i++) {
  if (a[i] === target) return i;                  //@cmp
}
return -1;                                        //@none`,
 run(r,a,{target}){for(let i=0;i<a.length;i++){r.ptr={i};r.count();if(a[i]===target){r.snap('cmp',{[i]:'found'},tx(`Gefunden an Position ${i} nach ${i+1} Vergleichen.`,`Found at position ${i} after ${i+1} comparisons.`));return}r.snap('cmp',{[i]:'cmp'},tx(`${a[i]} ≠ ${target}`,`${a[i]} ≠ ${target}`))}r.ptr={};r.snap('none',{},tx(`Nicht gefunden – alle ${a.length} Elemente angeschaut.`,`Not found – looked at all ${a.length} elements.`))}}),

V({id:'binary',cat:'searching',title:tx('Binäre Suche','Binary search'),sub:'O(log n)',view:'cells',keys:'binary search sorted halving logarithmic lo hi mid',sizes:[6,32,24],
 desc:tx('<p>Nur für <b>sortierte</b> Daten: In die Mitte schauen, dann ist klar, in welcher Hälfte der Wert liegen muss. Jeder Schritt halbiert den Suchraum – eine Million Einträge brauchen höchstens 20 Vergleiche.</p>','<p>Only for <b>sorted</b> data: look in the middle, then it’s clear which half the value must be in. Every step halves the search space – a million entries need at most 20 comparisons.</p>'),
 opts:[{k:'target',type:'number',label:tx('Gesucht','Target'),def:47}],
 data:n=>{let v=rnd(1,4);return Array.from({length:n},()=>v+=rnd(1,5))},
 code:`let lo = 0, hi = a.length - 1;
while (lo <= hi) {
  const mid = (lo + hi) >> 1;                     //@mid
  if (a[mid] === target) return mid;              //@found
  if (a[mid] < target) lo = mid + 1;              //@right
  else hi = mid - 1;                              //@left
}
return -1;                                        //@none`,
 run(r,a,{target}){let lo=0,hi=a.length-1,steps=0;while(lo<=hi){const mid=(lo+hi)>>1;r.range=[lo,hi];r.ptr={lo,mid,hi};steps++;r.count();r.snap('mid',{[mid]:'cmp'},tx(`Mitte von [${lo}…${hi}] ist ${mid}: a[${mid}] = ${a[mid]}.`,`Middle of [${lo}…${hi}] is ${mid}: a[${mid}] = ${a[mid]}.`));
  if(a[mid]===target){r.snap('found',{[mid]:'found'},tx(`Gefunden nach ${steps} Vergleichen. Lineare Suche hätte ${mid+1} gebraucht.`,`Found after ${steps} comparisons. Linear search would have needed ${mid+1}.`));return}
  if(a[mid]<target){r.snap('right',{[mid]:'cmp'},tx(`${a[mid]} < ${target}: Der Wert kann nur rechts liegen.`,`${a[mid]} < ${target}: the value can only be on the right.`));lo=mid+1}else{r.snap('left',{[mid]:'cmp'},tx(`${a[mid]} > ${target}: Der Wert kann nur links liegen.`,`${a[mid]} > ${target}: the value can only be on the left.`));hi=mid-1}}
  r.range=null;r.ptr={};r.snap('none',{},tx(`Nicht vorhanden – nach nur ${steps} Vergleichen sicher.`,`Not present – certain after only ${steps} comparisons.`))},
 tip:tx('Der Klassiker unter den Bugs: <code>(lo + hi) / 2</code> kann in Sprachen mit fester Integer-Größe überlaufen. In JavaScript nicht, aber <code>&gt;&gt; 1</code> schneidet gleich auf eine ganze Zahl ab.','The classic bug: <code>(lo + hi) / 2</code> can overflow in languages with fixed-size integers. Not in JavaScript, but <code>&gt;&gt; 1</code> truncates to an integer right away.'),
 links:[wiki('Binäre_Suche','Binary_search_algorithm')]}),

V({id:'twopointers',cat:'searching',title:tx('Zwei Zeiger','Two pointers'),sub:tx('Paar mit Summe finden in O(n)','Find a pair with a sum in O(n)'),view:'cells',keys:'two pointers pair sum sorted linear technique',sizes:[6,24,14],
 desc:tx('<p>Gesucht: zwei Zahlen, die zusammen ein Ziel ergeben. Mit zwei Schleifen sind das n² Paare. Ist die Liste sortiert, reicht ein Zeiger von links und einer von rechts: Ist die Summe zu klein, rückt der linke vor, ist sie zu groß, der rechte.</p>','<p>Wanted: two numbers that add up to a target. With two loops that’s n² pairs. If the list is sorted, one pointer from the left and one from the right suffice: if the sum is too small the left one moves, if it’s too big the right one.</p>'),
 opts:[{k:'target',type:'number',label:tx('Zielsumme','Target sum'),def:50}],
 data:n=>{let v=rnd(1,3);return Array.from({length:n},()=>v+=rnd(1,6))},
 code:`let l = 0, r = a.length - 1;
while (l < r) {
  const sum = a[l] + a[r];                        //@sum
  if (sum === target) return [l, r];              //@found
  if (sum < target) l++;                          //@inc
  else r--;                                       //@dec
}
return null;                                      //@none`,
 run(r,a,{target}){let l=0,R=a.length-1;while(l<R){const s=a[l]+a[R];r.ptr={l,r:R};r.count();r.info=`a[${l}] + a[${R}] = ${a[l]} + ${a[R]} = ${s}`;r.snap('sum',{[l]:'cmp',[R]:'cmp'});if(s===target){r.snap('found',{[l]:'found',[R]:'found'},tx(`Gefunden: ${a[l]} + ${a[R]} = ${target}.`,`Found: ${a[l]} + ${a[R]} = ${target}.`));return}if(s<target){r.snap('inc',{[l]:'cmp',[R]:'cmp'},tx(`${s} < ${target}: Summe muss größer werden → links vorrücken.`,`${s} < ${target}: sum must grow → move left pointer.`));l++}else{r.snap('dec',{[l]:'cmp',[R]:'cmp'},tx(`${s} > ${target}: Summe muss kleiner werden → rechts zurück.`,`${s} > ${target}: sum must shrink → move right pointer.`));R--}}r.ptr={};r.info='';r.snap('none',{},tx('Kein Paar ergibt diese Summe.','No pair adds up to this sum.'))}}),

V({id:'window',cat:'searching',title:tx('Gleitendes Fenster','Sliding window'),sub:tx('Summen über k Elemente in O(n)','Sums over k elements in O(n)'),view:'cells',keys:'sliding window moving sum maximum subarray k',sizes:[8,30,16],
 desc:tx('<p>Größte Summe aus k aufeinanderfolgenden Werten – zum Beispiel die umsatzstärkste Woche. Statt jedes Fenster neu zu summieren, schiebt man es weiter: einen Wert dazu, einen weg.</p>','<p>The largest sum of k consecutive values – for example the best week of sales. Instead of summing every window again, you slide it: add one value, remove one.</p>'),
 opts:[{k:'k',type:'number',label:tx('Fenstergröße k','Window size k'),def:4}],
 data:n=>Array.from({length:n},()=>rnd(1,20)),
 code:`let sum = 0;
for (let i = 0; i < k; i++) sum += a[i];          //@init
let best = sum;
for (let i = k; i < a.length; i++) {
  sum += a[i] - a[i - k];                         //@slide
  best = Math.max(best, sum);                     //@best
}`,
 run(r,a,{k}){k=Math.max(1,Math.min(a.length,k|0));let s=0;const win=(lo,hi,ex={})=>{const m={};for(let i=lo;i<=hi;i++)m[i]='win';return {...m,...ex}};for(let i=0;i<k;i++){s+=a[i];r.count(0);r.info=`sum = ${s}`;r.snap('init',win(0,i))}let best=s,bi=0;r.info=`sum = ${s} · best = ${best}`;r.snap('best',win(0,k-1),tx(`Erstes Fenster: Summe ${s}.`,`First window: sum ${s}.`));
  for(let i=k;i<a.length;i++){s+=a[i]-a[i-k];r.info=`sum = ${s} · best = ${best}`;r.snap('slide',win(i-k+1,i,{[i]:'found',[i-k]:'cmp'}),tx(`+ ${a[i]} rein, − ${a[i-k]} raus: Summe ${s} – mit nur 2 Rechenschritten statt ${k}.`,`+ ${a[i]} in, − ${a[i-k]} out: sum ${s} – with only 2 operations instead of ${k}.`));if(s>best){best=s;bi=i-k+1}r.count();r.info=`sum = ${s} · best = ${best}`;r.snap('best',win(i-k+1,i))}
  r.info=`best = ${best}`;r.snap(null,win(bi,bi+k-1),tx(`Beste Summe ${best} ab Position ${bi}.`,`Best sum ${best} from position ${bi}.`))}}),
