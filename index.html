{id:'stackqueue',cat:'structures',title:'Stack & Queue',sub:tx('LIFO und FIFO','LIFO and FIFO'),kind:'custom',keys:'stack queue lifo fifo push pop shift enqueue dequeue',
 desc:tx('<p>Ein <b>Stack</b> (Stapel) gibt das zuletzt Hineingelegte zuerst heraus – wie der Undo-Verlauf oder der Call Stack. Eine <b>Queue</b> (Warteschlange) das zuerst Hineingelegte – wie eine Druckerwarteschlange oder die Task Queue der Event Loop.</p>','<p>A <b>stack</b> returns the most recently added item first – like an undo history or the call stack. A <b>queue</b> returns the first added item – like a print queue or the event loop’s task queue.</p>'),
 html:()=>`<div class="av"><div class="sq">
  <div class="sq-box"><h4>Stack (LIFO)</h4><div class="av-btns"><button type="button" class="btn btn-primary btn-sm sk-push">push()</button><button type="button" class="btn btn-secondary btn-sm sk-pop">pop()</button><button type="button" class="btn btn-secondary btn-sm sk-peek">peek</button></div><div class="sq-stack"></div><p class="sq-log sk-log" aria-live="polite"></p></div>
  <div class="sq-box"><h4>Queue (FIFO)</h4><div class="av-btns"><button type="button" class="btn btn-primary btn-sm qu-push">enqueue()</button><button type="button" class="btn btn-secondary btn-sm qu-pop">dequeue()</button></div><div class="sq-queue"></div><p class="sq-log qu-log" aria-live="polite"></p></div>
 </div></div>`,
 init(wg){
  const st=[],qu=[];let n=1;
  const draw=()=>{$('.sq-stack',wg).innerHTML=st.map((v,i)=>`<span class="sq-item${i===st.length-1?' top':''}">${v}</span>`).join('');$('.sq-queue',wg).innerHTML=qu.length?qu.map((v,i)=>`<span class="sq-item${i===0?' top':''}">${v}</span>`).join(''):`<small style="color:var(--muted)">${tx('leer','empty')}</small>`};
  const log=(c,t)=>{$(c,wg).textContent=t};
  $('.sk-push',wg).addEventListener('click',()=>{if(st.length>=8)return log('.sk-log',tx('Stack voll (Demo-Grenze 8) – in echt: Stack Overflow.','Stack full (demo limit 8) – for real: stack overflow.'));st.push(n);log('.sk-log',`push(${n++}) → O(1)`);draw()});
  $('.sk-pop',wg).addEventListener('click',()=>{log('.sk-log',st.length?`pop() → ${st.pop()} · O(1)`:tx('pop() auf leerem Stack → undefined','pop() on empty stack → undefined'));draw()});
  $('.sk-peek',wg).addEventListener('click',()=>log('.sk-log',st.length?`stack.at(-1) → ${st.at(-1)}`:'undefined'));
  $('.qu-push',wg).addEventListener('click',()=>{if(qu.length>=10)return;qu.push(n);log('.qu-log',`enqueue(${n++}) → push · O(1)`);draw()});
  // Wert vorher holen: tx() wertet beide Sprachvarianten aus, ein shift() darin liefe zweimal
  $('.qu-pop',wg).addEventListener('click',()=>{if(!qu.length){log('.qu-log',tx('Queue leer','queue empty'));return}const v=qu.shift();log('.qu-log',tx(`dequeue() → ${v} · mit shift() O(n): alle anderen rücken nach`,`dequeue() → ${v} · with shift() O(n): all others move up`));draw()});
  [1,2,3].forEach(()=>{st.push(n);qu.push(n);n++});draw();
 },
 tip:tx('Ein Array als Queue mit <code>shift()</code> kostet O(n) pro Entnahme. Bei großen Queues hilft ein Index statt shift oder eine verkettete Liste – das Kapitel „In JavaScript“ misst den Unterschied.','An array as a queue with <code>shift()</code> costs O(n) per removal. For large queues an index instead of shift or a linked list helps – the “In JavaScript” chapter measures the difference.')},

{id:'hashtable',cat:'structures',title:tx('Hashtabelle','Hash table'),sub:tx('Wie Map und Set in O(1) finden','How Map and Set find in O(1)'),kind:'custom',keys:'hash table hashmap map set buckets collision load factor rehash',
 desc:tx('<p>Eine Hashfunktion macht aus dem Schlüssel eine Zahl, die Zahl bestimmt den Eimer (Bucket). Suchen heißt dann: Hash ausrechnen, in einen Eimer schauen – statt alles durchzugehen. Landen zwei Schlüssel im selben Eimer, ist das eine <b>Kollision</b>.</p>','<p>A hash function turns the key into a number, the number picks the bucket. Searching then means: compute the hash, look into one bucket – instead of going through everything. If two keys land in the same bucket, that’s a <b>collision</b>.</p>'),
 html:()=>`<div class="av"><div class="av-row"><div class="field"><label class="sim-lbl" for="ht-k">${tx('Schlüssel','Key')}</label><input class="input ht-in" id="ht-k" value="Kiwi" autocomplete="off" style="width:10em"></div><button type="button" class="btn btn-primary btn-sm ht-add">${ic('plus')}${tx('Einfügen','Insert')}</button><button type="button" class="btn btn-secondary btn-sm ht-find">${ic('search')}${tx('Suchen','Search')}</button><div class="field"><label class="sim-lbl">${tx('Eimer','Buckets')}<select class="ht-m">${[4,8,16].map(m=>`<option${m===8?' selected':''}>${m}</option>`).join('')}</select></label></div><label class="check-row"><input type="checkbox" class="ht-auto" checked>${tx('automatisch vergrößern bei Ladefaktor &gt; 0,75','auto-resize at load factor &gt; 0.75')}</label><button type="button" class="btn btn-secondary btn-sm ht-clear">${ic('trash')}${tx('Leeren','Clear')}</button></div>
  <pre class="ht-calc" aria-live="polite"></pre><div class="ht"></div>
  <div class="meters"><div><span class="meter ht-n">0</span><small>${tx('Schlüssel','keys')}</small></div><div><span class="meter ht-lf">0</span><small>${tx('Ladefaktor (Schlüssel / Eimer)','load factor (keys / buckets)')}</small></div><div><span class="meter ht-max">0</span><small>${tx('längste Kette','longest chain')}</small></div></div></div>`,
 init(wg){
  let m=8,B=[],hot=-1,mark={};
  const hash=k=>{let h=0;for(const c of k)h=(h*31+c.codePointAt(0))>>>0;return h};
  const calc=k=>{let h=0,lines=[];for(const c of k){const nh=(h*31+c.codePointAt(0))>>>0;lines.push(`h = ${h} · 31 + ${c.codePointAt(0)} ('${c}') = ${nh}`);h=nh}return lines.slice(-4).join('\n')+(lines.length>4?`\n… (${lines.length} ${tx('Zeichen','chars')})`:'')+`\n${tx('Eimer','bucket')} = ${h} % ${m} = ${h%m}`};
  const all=()=>B.flat();
  const reset=size=>{const ks=all();m=size;B=Array.from({length:m},()=>[]);ks.forEach(k=>B[hash(k)%m].push(k))};
  const draw=()=>{$('.ht',wg).innerHTML=B.map((ch,i)=>`<div class="ht-b"><span class="ht-i">${i}</span><div class="ht-chain${i===hot?' hot':''}">${ch.map(k=>`<span class="ht-k ${mark[k]||''}">${esc(k)}</span>`).join('')}</div></div>`).join('');const n=all().length;$('.ht-n',wg).textContent=n;$('.ht-lf',wg).textContent=(n/m).toLocaleString(LOCALE,{maximumFractionDigits:2});$('.ht-max',wg).textContent=Math.max(0,...B.map(c=>c.length));$('.ht-m',wg).value=String(m)};
  const add=k=>{k=k.trim();if(!k)return;const i=hash(k)%m;hot=i;mark={[k]:'new'};if(B[i].includes(k)){$('.ht-calc',wg).textContent=calc(k)+'\n'+tx('Schon vorhanden – eine Hashtabelle speichert jeden Schlüssel nur einmal.','Already present – a hash table stores every key only once.');draw();return}
   B[i].push(k);let txt=calc(k)+(B[i].length>1?'\n'+tx(`Kollision! Eimer ${i} hat jetzt ${B[i].length} Einträge.`,`Collision! Bucket ${i} now holds ${B[i].length} entries.`):'');
   if($('.ht-auto',wg).checked&&all().length/m>0.75&&m<64){reset(m*2);hot=hash(k)%m;txt+='\n'+tx(`Ladefaktor über 0,75 → auf ${m} Eimer vergrößert, alle Schlüssel neu verteilt (Rehashing, O(n)).`,`Load factor above 0.75 → grown to ${m} buckets, all keys redistributed (rehashing, O(n)).`)}
   $('.ht-calc',wg).textContent=txt;draw()};
  $('.ht-add',wg).addEventListener('click',()=>add($('.ht-in',wg).value));
  $('.ht-in',wg).addEventListener('keydown',e=>{if(e.key==='Enter')add(e.target.value)});
  $('.ht-find',wg).addEventListener('click',()=>{const k=$('.ht-in',wg).value.trim();const i=hash(k)%m;hot=i;mark={};let c=0,found=false;for(const x of B[i]){c++;if(x===k){mark[x]='hit';found=true;break}mark[x]='cmp'}$('.ht-calc',wg).textContent=calc(k)+'\n'+(found?tx(`Gefunden nach ${c} Vergleich(en) – egal wie viele Schlüssel insgesamt drin sind.`,`Found after ${c} comparison(s) – no matter how many keys there are in total.`):tx(`Nicht da – nur ${c} Vergleich(e) nötig, um das sicher zu wissen.`,`Not there – only ${c} comparison(s) needed to be sure.`));draw()});
  $('.ht-m',wg).addEventListener('change',e=>{reset(+e.target.value);hot=-1;draw()});
  $('.ht-clear',wg).addEventListener('click',()=>{B=Array.from({length:m},()=>[]);hot=-1;mark={};$('.ht-calc',wg).textContent='';draw()});
  B=Array.from({length:m},()=>[]);['Apfel','Birne','Banane','Kirsche','Mango'].forEach(k=>B[hash(k)%m].push(k));$('.ht-calc',wg).textContent=tx('Gib einen Schlüssel ein und füge ihn ein.','Enter a key and insert it.');draw();
 },
 tip:tx('JavaScript-Objekte, <code>Map</code> und <code>Set</code> sind intern Hashtabellen (bzw. ähnliche Strukturen). Darum ist <code>set.has(x)</code> O(1), <code>array.includes(x)</code> aber O(n).','JavaScript objects, <code>Map</code> and <code>Set</code> are hash tables internally (or similar structures). That’s why <code>set.has(x)</code> is O(1) but <code>array.includes(x)</code> is O(n).'),
 links:[mdn('Global_Objects/Map')]},

{id:'bst',cat:'structures',title:tx('Binärer Suchbaum','Binary search tree'),sub:tx('Und warum Reihenfolge zählt','And why order matters'),kind:'custom',keys:'binary search tree bst insert search traversal inorder preorder postorder height balanced degenerate',
 desc:tx('<p>Jeder Knoten hat links nur Kleinere und rechts nur Größere. Suchen heißt: an jedem Knoten links oder rechts abbiegen – bei einem ausgeglichenen Baum O(log n). Fügst du aber sortierte Werte ein, entsteht eine Liste – und Suchen wird O(n).</p>','<p>Every node has only smaller values on the left and only bigger ones on the right. Searching means: turn left or right at every node – O(log n) in a balanced tree. But insert sorted values and you get a list – and searching becomes O(n).</p>'),
 html:()=>`<div class="av"><div class="av-row"><div class="field"><label class="sim-lbl" for="bst-v">${tx('Wert','Value')}</label><input class="input bst-in" id="bst-v" type="number" value="42" style="width:6em"></div><button type="button" class="btn btn-primary btn-sm bst-add">${ic('plus')}${tx('Einfügen','Insert')}</button><button type="button" class="btn btn-secondary btn-sm bst-find">${ic('search')}${tx('Suchen','Search')}</button><button type="button" class="btn btn-secondary btn-sm bst-rand">${tx('15 zufällige','15 random')}</button><button type="button" class="btn btn-secondary btn-sm bst-sorted">${tx('1 bis 12 sortiert','1 to 12 sorted')}</button><button type="button" class="btn btn-secondary btn-sm bst-clear">${ic('trash')}${tx('Leeren','Clear')}</button></div>
  <div class="av-btns"><span class="sim-lbl" style="margin:0">${tx('Durchlaufen:','Traverse:')}</span>${[['in','In-Order'],['pre','Pre-Order'],['post','Post-Order'],['level','Level-Order']].map(([k,l])=>`<button type="button" class="btn btn-secondary btn-sm" data-tr="${k}">${l}</button>`).join('')}</div>
  <div class="tree-wrap bst-tree"></div><p class="vz-note bst-note" aria-live="polite"></p>
  <div class="meters"><div><span class="meter bst-n">0</span><small>${tx('Knoten','nodes')}</small></div><div><span class="meter bst-h">0</span><small>${tx('Höhe','height')}</small></div><div><span class="meter bst-ideal">0</span><small>${tx('ideale Höhe','ideal height')}</small></div></div></div>`,
 init(wg){
  let root=null,cls={},ecls={},timer=null;
  const ins=v=>{const n={v,l:null,r:null};if(!root){root=n;return [n]}let c=root;const path=[c];for(;;){if(v===c.v)return null;const s=v<c.v?'l':'r';if(!c[s]){c[s]=n;path.push(n);return path}c=c[s];path.push(c)}};
  const height=n=>n?1+Math.max(height(n.l),height(n.r)):0;
  const draw=()=>{const nodes=[],edges=[];let x=0;const walk=(n,d)=>{if(!n)return;walk(n.l,d+1);n.x=x++;n.d=d;nodes.push({id:n.v,x:n.x,y:d,label:n.v});walk(n.r,d+1)};walk(root,0);const ed=n=>{if(!n)return;for(const c of [n.l,n.r])if(c){edges.push([n.v,c.v]);ed(c)}};ed(root);
   $('.bst-tree',wg).innerHTML=treeSVG(nodes,edges,cls,ecls);$('.bst-n',wg).textContent=nodes.length;$('.bst-h',wg).textContent=height(root);$('.bst-ideal',wg).textContent=nodes.length?Math.ceil(Math.log2(nodes.length+1)):0};
  const note=h=>{$('.bst-note',wg).innerHTML=h};
  const hl=path=>{cls={};ecls={};path.forEach((n,i)=>{cls[n.v]='hot';if(i)ecls[path[i-1].v+'-'+n.v]='hot'})};
  const stopT=()=>{clearInterval(timer);timer=null};
  $('.bst-add',wg).addEventListener('click',()=>{stopT();const v=Math.round(+$('.bst-in',wg).value);const p=ins(v);if(!p){note(tx(`${v} ist schon im Baum.`,`${v} is already in the tree.`));return}hl(p);cls[v]='hit';note(tx(`${v} eingefügt nach ${p.length-1} Vergleichen: ${p.slice(0,-1).map(n=>v<n.v?`${v} &lt; ${n.v} → links`:`${v} &gt; ${n.v} → rechts`).join(' · ')||'neue Wurzel'}`,`${v} inserted after ${p.length-1} comparisons: ${p.slice(0,-1).map(n=>v<n.v?`${v} &lt; ${n.v} → left`:`${v} &gt; ${n.v} → right`).join(' · ')||'new root'}`));draw();$('.bst-in',wg).value=rnd(1,99)});
  $('.bst-find',wg).addEventListener('click',()=>{stopT();const v=Math.round(+$('.bst-in',wg).value);let c=root;const p=[];while(c){p.push(c);if(v===c.v)break;c=v<c.v?c.l:c.r}hl(p);if(c)cls[v]='hit';note(c?tx(`Gefunden nach ${p.length} Vergleichen.`,`Found after ${p.length} comparisons.`):tx(`Nicht im Baum – nach ${p.length} Vergleichen sicher.`,`Not in the tree – certain after ${p.length} comparisons.`));draw()});
  const fill=vals=>{stopT();root=null;cls={};ecls={};vals.forEach(ins);draw()};
  $('.bst-rand',wg).addEventListener('click',()=>{const s=new Set();while(s.size<15)s.add(rnd(1,99));fill([...s]);note(tx('Zufällige Reihenfolge: Der Baum ist halbwegs ausgeglichen.','Random order: the tree is reasonably balanced.'))});
  $('.bst-sorted',wg).addEventListener('click',()=>{fill(Array.from({length:12},(_,i)=>i+1));note(tx('Sortiert eingefügt: Jeder neue Wert ist größer als alle anderen – der Baum entartet zu einer Liste. Höhe 12 statt 4.','Inserted in sorted order: every new value is bigger than all others – the tree degenerates into a list. Height 12 instead of 4.'))});
  $('.bst-clear',wg).addEventListener('click',()=>{fill([]);note('')});
  $$('[data-tr]',wg).forEach(b=>b.addEventListener('click',()=>{stopT();const seq=[],t=b.dataset.tr;const rec=n=>{if(!n)return;if(t==='pre')seq.push(n.v);rec(n.l);if(t==='in')seq.push(n.v);rec(n.r);if(t==='post')seq.push(n.v)};if(t==='level'){const q=root?[root]:[];while(q.length){const n=q.shift();seq.push(n.v);if(n.l)q.push(n.l);if(n.r)q.push(n.r)}}else rec(root);
   let i=0;cls={};ecls={};const expl={in:tx('links, Knoten, rechts – ergibt die sortierte Reihenfolge','left, node, right – yields sorted order'),pre:tx('Knoten, links, rechts – zum Kopieren eines Baums','node, left, right – for copying a tree'),post:tx('links, rechts, Knoten – zum Löschen eines Baums','left, right, node – for deleting a tree'),level:tx('Ebene für Ebene mit einer Queue – Breitensuche','level by level with a queue – breadth-first')}[t];
   timer=setInterval(()=>{if(i>=seq.length){stopT();return}cls[seq[i]]='hit';i++;note(`${b.textContent} (${expl}): ${seq.slice(0,i).join(', ')}`);draw()},reducedMotion()?150:420)}));
  fill([50,30,70,20,40,60,80,35,65]);note(tx('Füge Werte ein oder suche einen.','Insert values or search for one.'));
  return stopT;
 },
 tip:tx('Echte Bibliotheken verwenden selbstbalancierende Bäume (Rot-Schwarz, AVL), die nach jedem Einfügen umbauen. Die Höhe bleibt dann immer bei O(log n).','Real libraries use self-balancing trees (red-black, AVL) that restructure after every insert. The height then always stays at O(log n).'),
 links:[wiki('Binärer_Suchbaum','Binary_search_tree')]},

{id:'binheap',cat:'structures',title:tx('Binärer Heap','Binary heap'),sub:tx('Prioritätswarteschlange','Priority queue'),kind:'custom',keys:'heap priority queue min heap sift up sift down array tree',
 desc:tx('<p>Ein Min-Heap hält das Kleinste immer oben. Neues kommt ans Ende und steigt auf, solange es kleiner als sein Elternknoten ist. Beim Entnehmen rückt das letzte Element an die Spitze und sinkt ab. Beides O(log n). Der Baum steckt platzsparend in einem Array.</p>','<p>A min heap always keeps the smallest on top. New items go to the end and rise while they’re smaller than their parent. On removal the last element moves to the top and sinks. Both O(log n). The tree lives compactly in an array.</p>'),
 html:()=>`<div class="av"><div class="av-row"><div class="field"><label class="sim-lbl" for="hp-v">${tx('Wert','Value')}</label><input class="input hp-in" id="hp-v" type="number" value="3" style="width:6em"></div><button type="button" class="btn btn-primary btn-sm hp-add">${ic('plus')}${tx('Einfügen','Insert')}</button><button type="button" class="btn btn-secondary btn-sm hp-pop">${tx('Minimum entnehmen','Extract minimum')}</button><button type="button" class="btn btn-secondary btn-sm hp-rand">${tx('Zufällig füllen','Fill randomly')}</button></div>
  <div class="tree-wrap hp-tree"></div><p class="sim-lbl" style="margin:0">${tx('Dasselbe als Array – Kinder von i liegen bei 2i+1 und 2i+2','The same as an array – children of i are at 2i+1 and 2i+2')}</p><div class="vz-cells hp-arr"></div><p class="vz-note hp-note" aria-live="polite"></p></div>`,
 init(wg){
  let h=[],frames=[],timer=null;
  const render=(arr,mk={},msg)=>{const nodes=arr.map((v,i)=>{const d=Math.floor(Math.log2(i+1)),pos=i-(2**d-1),span=2**(Math.floor(Math.log2(Math.max(1,arr.length)))-d);return {id:i,x:(pos+.5)*span*1-.5,y:d,label:v}});const edges=arr.map((_,i)=>i?[(i-1)>>1,i]:null).filter(Boolean);
   const minX=Math.min(0,...nodes.map(n=>n.x));nodes.forEach(n=>n.x-=minX);
   $('.hp-tree',wg).innerHTML=treeSVG(nodes,edges,mk);$('.hp-arr',wg).innerHTML=arr.map((v,i)=>`<div class="vz-cell ${mk[i]==='cmp'?'cmp':mk[i]==='hit'?'found':''}"><span class="v">${v}</span><span class="i">${i}</span><span class="p"></span></div>`).join('');if(msg!=null)$('.hp-note',wg).innerHTML=msg};
  const play=()=>{clearInterval(timer);let i=0;const step=()=>{const f=frames[i++];if(!f){clearInterval(timer);return}render(f.a,f.mk,f.msg)};step();timer=setInterval(step,reducedMotion()?250:650)};
  const F=(mk,msg)=>frames.push({a:h.slice(),mk,msg});
  $('.hp-add',wg).addEventListener('click',()=>{if(h.length>=15){$('.hp-note',wg).textContent=tx('Demo-Grenze: 15 Elemente.','Demo limit: 15 elements.');return}const v=Math.round(+$('.hp-in',wg).value);frames=[];h.push(v);let i=h.length-1;F({[i]:'hit'},tx(`${v} kommt ans Ende (Index ${i}).`,`${v} goes to the end (index ${i}).`));
   while(i>0){const p=(i-1)>>1;F({[i]:'cmp',[p]:'cmp'},tx(`Vergleiche mit Elternknoten ${h[p]} (Index ${p}).`,`Compare with parent ${h[p]} (index ${p}).`));if(h[p]<=h[i]){F({[i]:'hit'},tx(`${h[p]} ≤ ${h[i]}: Heap-Eigenschaft stimmt, fertig.`,`${h[p]} ≤ ${h[i]}: heap property holds, done.`));break}[h[p],h[i]]=[h[i],h[p]];i=p;F({[i]:'hit'},tx(`Kleiner als der Elternknoten → aufsteigen.`,`Smaller than its parent → rise.`))}
   if(i===0)F({0:'hit'},tx(`${h[0]} ist das neue Minimum an der Spitze.`,`${h[0]} is the new minimum at the top.`));$('.hp-in',wg).value=rnd(1,60);play()});
  $('.hp-pop',wg).addEventListener('click',()=>{if(!h.length)return;frames=[];const min=h[0];F({0:'hit'},tx(`Minimum ${min} wird entnommen.`,`Minimum ${min} is extracted.`));const last=h.pop();if(h.length){h[0]=last;let i=0;F({0:'cmp'},tx(`Das letzte Element ${last} rückt an die Spitze.`,`The last element ${last} moves to the top.`));
   for(;;){const l=2*i+1,r=l+1;let m=i;if(l<h.length&&h[l]<h[m])m=l;if(r<h.length&&h[r]<h[m])m=r;if(m===i){F({[i]:'hit'},tx('Kein Kind ist kleiner – fertig.','No child is smaller – done.'));break}F({[i]:'cmp',[m]:'cmp'},tx(`Kleinstes Kind ist ${h[m]} → tauschen, absinken.`,`Smallest child is ${h[m]} → swap, sink.`));[h[i],h[m]]=[h[m],h[i]];i=m}}else F({},tx('Heap ist leer.','Heap is empty.'));play()});
  $('.hp-rand',wg).addEventListener('click',()=>{clearInterval(timer);h=[];for(let k=0;k<10;k++){h.push(rnd(1,60));let i=h.length-1;while(i>0&&h[(i-1)>>1]>h[i]){const p=(i-1)>>1;[h[p],h[i]]=[h[i],h[p]];i=p}}render(h,{},tx('10 zufällige Werte eingefügt. Oben steht immer das Minimum – der Rest ist nur grob geordnet.','10 random values inserted. The minimum is always on top – the rest is only roughly ordered.'))});
  $('.hp-rand',wg).click();
  return ()=>clearInterval(timer);
 },
 tip:tx('Heaps stecken in Prioritätswarteschlangen, Dijkstras Algorithmus, Scheduling und „Top-k“-Abfragen. JavaScript hat keinen eingebauten Heap – die Pfadsuche hier im Kapitel Graphen nutzt einen selbst geschriebenen.','Heaps power priority queues, Dijkstra’s algorithm, scheduling and “top k” queries. JavaScript has no built-in heap – the pathfinding in the graphs chapter uses a hand-written one.'),
 links:[wiki('Binärer_Heap','Binary_heap')]},

{id:'pathfinding',cat:'graphs',title:tx('Wegsuche im Gitter','Pathfinding on a grid'),sub:'BFS, DFS, Dijkstra, A*',kind:'custom',keys:'pathfinding bfs dfs dijkstra a star greedy grid maze shortest path heuristic',
 desc:tx('<p>Zeichne Wände und Schlamm (kostet 5 statt 1) und lass fünf Verfahren den Weg von S nach Z suchen. Hellblau: besucht. Gelb: gefundener Weg. Vergleiche, wie viel jedes Verfahren absuchen muss – und ob der Weg wirklich der kürzeste ist.</p>','<p>Draw walls and mud (costs 5 instead of 1) and let five methods find the way from S to Z. Light: visited. Yellow: the path found. Compare how much each method has to search – and whether the path is really the shortest.</p>'),
 html:()=>`<div class="av"><div class="av-row">
   <fieldset class="sim-f"><legend>${tx('Verfahren','Algorithm')}</legend><div class="ca-vals">${[['bfs','BFS'],['dfs','DFS'],['dijkstra','Dijkstra'],['astar','A*'],['greedy','Greedy']].map(([v,l],i)=>`<label><input type="radio" name="pf-a" value="${v}"${i===3?' checked':''}>${l}</label>`).join('')}</div></fieldset>
   <fieldset class="sim-f"><legend>${tx('Zeichnen','Draw')}</legend><div class="ca-vals">${[['wall',tx('Wand','Wall')],['mud',tx('Schlamm','Mud')],['start','Start'],['end',tx('Ziel','Goal')],['erase',tx('Radierer','Eraser')]].map(([v,l],i)=>`<label><input type="radio" name="pf-m" value="${v}"${i===0?' checked':''}>${l}</label>`).join('')}</div></fieldset></div>
  <div class="av-btns"><button type="button" class="btn btn-primary btn-sm pf-go">${ic('play2')}${tx('Suchen','Search')}</button><button type="button" class="btn btn-secondary btn-sm pf-maze">${tx('Labyrinth','Maze')}</button><button type="button" class="btn btn-secondary btn-sm pf-rand">${tx('Zufällige Wände','Random walls')}</button><button type="button" class="btn btn-secondary btn-sm pf-mud">${tx('Schlammfeld','Mud field')}</button><button type="button" class="btn btn-secondary btn-sm pf-clear">${ic('trash')}${tx('Leeren','Clear')}</button>${speedSel('pf-speed',3)}</div>
  <div class="pf-grid" role="application" aria-label="${tx('Gitter zum Zeichnen von Wänden','Grid for drawing walls')}"></div>
  <p class="vz-note pf-note" aria-live="polite"></p>
  <div class="meters"><div><span class="meter pf-vis">–</span><small>${tx('besuchte Felder','visited cells')}</small></div><div><span class="meter pf-len">–</span><small>${tx('Weglänge','path length')}</small></div><div><span class="meter pf-cost">–</span><small>${tx('Wegkosten','path cost')}</small></div></div></div>`,
 init(wg){
  const W=31,H=17,grid=$('.pf-grid',wg);grid.style.gridTemplateColumns=`repeat(${W},1fr)`;
  let cells=Array(W*H).fill(''),S=H/2|0,E=0,timer=null,down=false;S=(H>>1)*W+3;E=(H>>1)*W+W-4;
  grid.innerHTML=cells.map(()=>'<div class="pf-c"></div>').join('');const els=[...grid.children];
  const paint=()=>els.forEach((el,i)=>{el.className='pf-c'+(cells[i]?' '+cells[i]:'')+(i===S?' start':i===E?' end':'')});
  const clearRun=()=>{clearTimeout(timer);timer=null;els.forEach(el=>el.classList.remove('vis','front','path'));['.pf-vis','.pf-len','.pf-cost'].forEach(c=>$(c,wg).textContent='–')};
  const apply=i=>{const m=$('input[name="pf-m"]:checked',wg).value;if(m==='start'){if(i!==E){S=i;cells[i]=''}}else if(m==='end'){if(i!==S){E=i;cells[i]=''}}else if(i!==S&&i!==E)cells[i]=m==='erase'?'':m;paint()};
  const idx=e=>{const el=e.target.closest('.pf-c');return el?els.indexOf(el):-1};
  grid.addEventListener('pointerdown',e=>{const i=idx(e);if(i<0)return;e.preventDefault();down=true;clearRun();apply(i)});
  grid.addEventListener('pointerover',e=>{if(!down)return;const m=$('input[name="pf-m"]:checked',wg).value;if(m==='start'||m==='end')return;const i=idx(e);if(i>=0)apply(i)});
  const up=()=>{down=false};window.addEventListener('pointerup',up);
  const INFO={bfs:tx('Breitensuche: wellenförmig in alle Richtungen. Findet den Weg mit den wenigsten Schritten – Kosten ignoriert sie.','Breadth-first: spreads out like a wave. Finds the path with the fewest steps – it ignores costs.'),dfs:tx('Tiefensuche: rennt in eine Richtung, bis es nicht weitergeht. Findet irgendeinen Weg, oft einen absurden Umweg.','Depth-first: runs in one direction until it can’t go on. Finds some path, often an absurd detour.'),dijkstra:tx('Dijkstra: erweitert immer das Feld mit den bisher geringsten Kosten. Garantiert den günstigsten Weg, sucht aber in alle Richtungen.','Dijkstra: always expands the cell with the lowest cost so far. Guarantees the cheapest path, but searches in all directions.'),astar:tx('A*: wie Dijkstra, aber mit einer Schätzung der Restentfernung (Manhattan-Distanz). Garantiert den günstigsten Weg und sucht zielgerichtet.','A*: like Dijkstra, but with an estimate of the remaining distance (Manhattan distance). Guarantees the cheapest path and searches purposefully.'),greedy:tx('Greedy Best-First: nur die Schätzung zählt. Sehr schnell, aber der Weg ist oft nicht der kürzeste.','Greedy best-first: only the estimate counts. Very fast, but the path is often not the shortest.')};
  $('.pf-go',wg).addEventListener('click',()=>{
   clearRun();const alg=$('input[name="pf-a"]:checked',wg).value,sp=+$('.pf-speed',wg).value;const res=pathfind(alg,W,H,cells,S,E);let i=0;
   $('.pf-note',wg).innerHTML=INFO[alg];
   const batch=sp<=8?6:sp<=35?2:1;
   const step=()=>{for(let b=0;b<batch&&i<res.order.length;b++,i++){const c=res.order[i];els[c].classList.add('vis')}$('.pf-vis',wg).textContent=i;
    if(i<res.order.length){timer=setTimeout(step,sp);return}
    let j=0;const pstep=()=>{if(j<res.path.length){els[res.path[j++]].classList.add('path');timer=setTimeout(pstep,Math.min(40,sp))}else{$('.pf-len',wg).textContent=res.path.length?res.path.length-1:tx('keiner','none');$('.pf-cost',wg).textContent=res.path.length?res.cost:'–';if(!res.path.length)$('.pf-note',wg).innerHTML=INFO[alg]+' <b>'+tx('Kein Weg möglich.','No path possible.')+'</b>'}};pstep()};
   step();
  });
  const maze=()=>{clearRun();cells=Array(W*H).fill('wall');const st=[[1,1]];cells[W+1]='';const seen=new Set([W+1]);while(st.length){const [x,y]=st.at(-1);const nb=shuffle([[2,0],[-2,0],[0,2],[0,-2]]).map(([dx,dy])=>[x+dx,y+dy,x+dx/2,y+dy/2]).filter(([nx,ny])=>nx>0&&ny>0&&nx<W-1&&ny<H-1&&!seen.has(ny*W+nx));if(!nb.length){st.pop();continue}const [nx,ny,mx,my]=nb[0];cells[ny*W+nx]='';cells[my*W+mx]='';seen.add(ny*W+nx);st.push([nx,ny])}
   for(let k=0;k<W*H/14;k++){const i=rnd(0,W*H-1),x=i%W,y=i/W|0;if(x>0&&y>0&&x<W-1&&y<H-1)cells[i]=''}S=W+1;E=(H-2)*W+W-2;paint()};
  $('.pf-maze',wg).addEventListener('click',maze);
  $('.pf-rand',wg).addEventListener('click',()=>{clearRun();cells=cells.map(()=>Math.random()<.28?'wall':'');cells[S]=cells[E]='';paint()});
  // Schlammband quer über das Feld, nur die oberste Zeile bleibt als sauberer Umweg frei
  $('.pf-mud',wg).addEventListener('click',()=>{clearRun();cells=Array(W*H).fill('');S=(H>>1)*W+3;E=(H>>1)*W+W-4;const cx=W>>1;for(let y=1;y<H;y++)for(let x=cx-3;x<=cx+3;x++)cells[y*W+x]='mud';paint();$('.pf-note',wg).textContent=tx('Durch den Schlamm sind es wenige Schritte, aber teuer. Oben herum ist es weiter, aber billiger. Probier BFS gegen Dijkstra.','Through the mud is few steps but expensive. Around the top is longer but cheaper. Try BFS against Dijkstra.')});
  $('.pf-clear',wg).addEventListener('click',()=>{clearRun();cells=Array(W*H).fill('');paint()});
  for(let y=3;y<H-3;y++)cells[y*W+15]='wall';paint();$('.pf-note',wg).textContent=tx('Wähle ein Verfahren und drück „Suchen“. Wände zeichnest du mit gedrückter Maus oder dem Finger.','Pick an algorithm and press “Search”. Draw walls by dragging with the mouse or finger.');
  return ()=>{clearTimeout(timer);window.removeEventListener('pointerup',up)};
 },
 tip:tx('Mit „Schlammfeld“ siehst du den Unterschied am deutlichsten: BFS läuft stur durch den Schlamm (wenige Schritte, hohe Kosten), Dijkstra und A* gehen außen herum.','“Mud field” shows the difference best: BFS ploughs straight through the mud (few steps, high cost), Dijkstra and A* walk around it.'),
 links:[wiki('A*-Algorithmus','A*_search_algorithm'),wiki('Dijkstra-Algorithmus','Dijkstra%27s_algorithm')]},

{id:'topo',cat:'graphs',title:tx('Topologische Sortierung','Topological sort'),sub:tx('Abhängigkeiten in Reihenfolge bringen','Putting dependencies in order'),kind:'custom',keys:'topological sort kahn dag dependencies cycle build order npm',
 desc:tx('<p>In welcher Reihenfolge zieht man sich an, wenn manche Teile vor anderen kommen müssen? Genau dieses Problem lösen Build-Tools, npm und Angulars Dependency Injection. Kahns Algorithmus nimmt immer etwas, das keine offenen Voraussetzungen mehr hat (Zahl im Kreis = offene Voraussetzungen).</p>','<p>In which order do you get dressed if some items must come before others? Build tools, npm and Angular’s dependency injection solve exactly this problem. Kahn’s algorithm always takes something with no remaining prerequisites (number in the circle = open prerequisites).</p>'),
 html:()=>`<div class="av"><label class="check-row"><input type="checkbox" class="tp-cyc">${tx('Zyklus einbauen: Jacke vor Hemd','Add a cycle: jacket before shirt')}</label><p class="tp-edges"></p><div class="tp tp-nodes"></div>
  <div class="av-btns"><button type="button" class="btn btn-secondary btn-sm tp-reset">${ic('refresh')}${tx('Von vorn','Restart')}</button><button type="button" class="btn btn-primary btn-sm tp-step">${ic('fwd')}${tx('Nächster Schritt','Next step')}</button><button type="button" class="btn btn-secondary btn-sm tp-all">${tx('Alles','All')}</button></div>
  <p class="vz-note tp-note" aria-live="polite"></p><p class="sim-lbl" style="margin:0">${tx('Reihenfolge','Order')}</p><ol class="ops tp-out"></ol></div>`,
 init(wg){
  const N=tx(['Unterhose','Socken','Hemd','Hose','Gürtel','Krawatte','Schuhe','Jacke','Uhr'],['Underwear','Socks','Shirt','Trousers','Belt','Tie','Shoes','Jacket','Watch']);
  const BASE=[[0,3],[3,4],[2,4],[2,5],[4,7],[5,7],[3,6],[1,6]];let E,deg,ready,out,cur;
  const reset=()=>{E=BASE.concat($('.tp-cyc',wg).checked?[[7,2]]:[]);deg=N.map((_,i)=>E.filter(([,b])=>b===i).length);out=[];cur=-1;ready=N.map((_,i)=>i).filter(i=>!deg[i]);$('.tp-edges',wg).innerHTML=tx('Muss vorher: ','Must come first: ')+E.map(([a,b])=>`${N[a]} → ${N[b]}`).join(' · ');$('.tp-note',wg).textContent=tx(`Startbereit (keine Voraussetzungen): ${ready.map(i=>N[i]).join(', ')}.`,`Ready (no prerequisites): ${ready.map(i=>N[i]).join(', ')}.`);draw()};
  const draw=()=>{$('.tp-nodes',wg).innerHTML=N.map((n,i)=>`<span class="tp-n${out.includes(i)?' out':ready.includes(i)?' ready':''}${i===cur?' cur':''}"><b>${deg[i]}</b>${n}</span>`).join('');$('.tp-out',wg).innerHTML=out.map(i=>`<li>${N[i]}</li>`).join('')};
  const step=()=>{if(!ready.length){$('.tp-note',wg).innerHTML=out.length===N.length?tx('Fertig – alle Teile in gültiger Reihenfolge.','Done – all items in a valid order.'):tx(`<b>Zyklus!</b> Nichts ist mehr startbereit, aber ${N.length-out.length} Teile fehlen noch. Genau so meldet Angular „Circular dependency“.`,`<b>Cycle!</b> Nothing is ready any more, but ${N.length-out.length} items are still missing. That’s exactly how Angular reports a “circular dependency”.`);return false}
   const i=ready.shift();cur=i;out.push(i);const freed=[];for(const [a,b] of E)if(a===i){deg[b]--;if(!deg[b]){ready.push(b);freed.push(N[b])}}
   $('.tp-note',wg).textContent=tx(`${N[i]} anziehen. ${freed.length?'Jetzt startbereit: '+freed.join(', ')+'.':''}`,`Put on ${N[i]}. ${freed.length?'Now ready: '+freed.join(', ')+'.':''}`);draw();return true};
  $('.tp-step',wg).addEventListener('click',step);$('.tp-all',wg).addEventListener('click',()=>{while(step());});$('.tp-reset',wg).addEventListener('click',reset);$('.tp-cyc',wg).addEventListener('change',reset);reset();
 },
 links:[wiki('Topologische_Sortierung','Topological_sorting')]},

/* ---------- Rekursion & DP ---------- */
{id:'fibtree',cat:'recursion',title:tx('Der Aufrufbaum','The call tree'),sub:tx('Fibonacci naiv gegen mit Gedächtnis','Fibonacci naive vs memoised'),kind:'custom',keys:'recursion fibonacci call tree memoization exponential overlapping subproblems',
 desc:tx('<p><code>fib(n) = fib(n−1) + fib(n−2)</code> ist elegant – und berechnet dieselben Werte immer wieder. Rot: Aufrufe, deren Ergebnis schon einmal berechnet wurde. Mit einem Cache (Memoisierung) wird jeder Wert genau einmal berechnet.</p>','<p><code>fib(n) = fib(n−1) + fib(n−2)</code> is elegant – and computes the same values over and over. Red: calls whose result has been computed before. With a cache (memoisation) every value is computed exactly once.</p>'),
 html:()=>`<div class="av"><div class="av-row"><div class="sim-range"><label class="sim-lbl" for="fb-n">n</label><input type="range" id="fb-n" class="fb-n" min="2" max="8" value="6"><output for="fb-n"></output></div><fieldset class="sim-f"><legend>${tx('Variante','Variant')}</legend><div class="ca-vals"><label><input type="radio" name="fb-m" value="naive" checked>${tx('naiv','naive')}</label><label><input type="radio" name="fb-m" value="memo">${tx('mit Cache','with cache')}</label></div></fieldset></div>
  <div class="tree-wrap fb-tree"></div><div class="meters"><div><span class="meter fb-calls">–</span><small>${tx('Aufrufe','calls')}</small></div><div><span class="meter fb-dup">–</span><small>${tx('davon doppelt','duplicates')}</small></div><div><span class="meter fb-big">–</span><small>${tx('Aufrufe für n = 40','calls for n = 40')}</small></div></div></div>`,
 init(wg){
  const draw=()=>{const n=+$('.fb-n',wg).value,memo=$('input[name="fb-m"]:checked',wg).value==='memo';$('output',wg).textContent=n;
   const nodes=[],edges=[],cls={},seen=new Set(),cache=new Set();let x=0,id=0,dup=0;
   const rec=(k,d)=>{const me=id++;let kids=[];const hit=memo&&cache.has(k);if(!hit&&k>=2){kids=[rec(k-1,d+1),rec(k-2,d+1)]}
    const xs=kids.map(c=>nodes.find(nn=>nn.id===c).x);const nx=kids.length?(xs[0]+xs[1])/2:x++;nodes.push({id:me,x:nx,y:d,label:`f${k}`});kids.forEach(c=>edges.push([me,c]));
    if(hit)cls[me]='memo';else if(seen.has(k)){cls[me]='dup';dup++}seen.add(k);if(memo)cache.add(k);return me};
   rec(n,0);$('.fb-tree',wg).innerHTML=treeSVG(nodes,edges,cls);$('.fb-calls',wg).textContent=nodes.length;$('.fb-dup',wg).textContent=memo?0:dup;$('.fb-big',wg).textContent=memo?'79':'331.160.281'.replace(/\./g,LANG==='de'?'.':',')};

 },
 tip:tx('Grün umrandet (mit Cache): Der Wert kommt direkt aus dem Speicher, der Ast wird nicht weiter verfolgt. Aus über 300 Millionen Aufrufen für n = 40 werden 79.','Outlined green (with cache): the value comes straight from memory, the branch isn’t followed further. More than 300 million calls for n = 40 become 79.')},

{id:'hanoi',cat:'recursion',title:tx('Türme von Hanoi','Towers of Hanoi'),sub:tx('Rekursion in Reinform','Recursion in its purest form'),kind:'custom',keys:'towers of hanoi recursion exponential 2^n',
 desc:tx('<p>Bewege den Turm von links nach rechts – immer nur eine Scheibe, nie eine größere auf eine kleinere. Die rekursive Idee: Um n Scheiben zu bewegen, bewege n−1 auf den Hilfsstab, die größte ans Ziel, dann die n−1 darauf. Das braucht 2ⁿ − 1 Züge.</p>','<p>Move the tower from left to right – one disc at a time, never a bigger one on a smaller one. The recursive idea: to move n discs, move n−1 to the spare peg, the largest to the target, then the n−1 on top. That takes 2ⁿ − 1 moves.</p>'),

{id:'levenshtein',cat:'recursion',title:tx('Editierdistanz','Edit distance'),sub:tx('Dynamische Programmierung als Tabelle','Dynamic programming as a table'),kind:'custom',keys:'levenshtein edit distance dynamic programming table spell check diff fuzzy search',
 desc:tx('<p>Wie viele Einfüge-, Lösch- und Ersetzungsschritte trennen zwei Wörter? Jede Zelle ist die Distanz zwischen zwei Anfangsstücken und hängt nur von drei Nachbarn ab: links (einfügen), oben (löschen), diagonal (ersetzen oder gleich). So steckt in jeder Rechtschreibkorrektur und Fuzzy-Suche eine Tabelle.</p>','<p>How many insert, delete and replace steps separate two words? Every cell is the distance between two prefixes and depends only on three neighbours: left (insert), top (delete), diagonal (replace or equal). That’s the table inside every spell checker and fuzzy search.</p>'),
 html:()=>`<div class="av"><div class="av-row"><div class="field"><label class="sim-lbl" for="lv-a">${tx('Wort A','Word A')}</label><input class="input lv-a" id="lv-a" value="${tx('Katze','kitten')}" maxlength="12" autocomplete="off" style="width:9em"></div><div class="field"><label class="sim-lbl" for="lv-b">${tx('Wort B','Word B')}</label><input class="input lv-b" id="lv-b" value="${tx('Tatzen','sitting')}" maxlength="12" autocomplete="off" style="width:9em"></div>${speedSel('lv-speed',2)}</div>
  <div class="av-btns"><button type="button" class="btn btn-secondary btn-sm lv-next">${ic('fwd')}${tx('Eine Zelle','One cell')}</button><button type="button" class="btn btn-primary btn-sm lv-play" aria-pressed="false">${ic('play2')}<span>${tx('Abspielen','Play')}</span></button><button type="button" class="btn btn-secondary btn-sm lv-all">${tx('Alles','All')}</button></div>
  <div class="dp-wrap"><table class="dp lv-t"></table></div><p class="vz-note lv-note" aria-live="polite"></p><ol class="ops lv-ops"></ol></div>`,
 init(wg){
  let A,B,D,k,cells,timer=null;
  const stop=()=>{clearTimeout(timer);timer=null;$('.lv-play',wg).setAttribute('aria-pressed','false');$('.lv-play span',wg).textContent=tx('Abspielen','Play')};
  const reset=()=>{stop();A=$('.lv-a',wg).value;B=$('.lv-b',wg).value;D=Array.from({length:A.length+1},(_,i)=>Array.from({length:B.length+1},(_,j)=>i===0?j:j===0?i:null));cells=[];for(let i=1;i<=A.length;i++)for(let j=1;j<=B.length;j++)cells.push([i,j]);k=0;draw();$('.lv-note',wg).textContent=tx('Erste Zeile und Spalte: Vom leeren Wort aus braucht man so viele Einfügungen, wie Buchstaben da sind.','First row and column: from the empty word you need as many insertions as there are letters.');$('.lv-ops',wg).innerHTML=''};
  const draw=(cur,path)=>{const pc=new Set((path||[]).map(([i,j])=>i+','+j));$('.lv-t',wg).innerHTML=`<tr><th></th><th>ε</th>${[...B].map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+D.map((row,i)=>`<tr><th>${i?esc(A[i-1]):'ε'}</th>${row.map((v,j)=>{let c=v==null?'empty':'';if(cur){if(cur[0]===i&&cur[1]===j)c='cur';else if((i===cur[0]-1&&j===cur[1]-1)||(i===cur[0]-1&&j===cur[1])||(i===cur[0]&&j===cur[1]-1))c='src'}if(pc.has(i+','+j))c='path';return `<td class="${c}">${v??'·'}</td>`}).join('')}</tr>`).join('')};
  const next=()=>{if(k>=cells.length){finish();return false}const [i,j]=cells[k++];const same=A[i-1]===B[j-1],del=D[i-1][j]+1,ins=D[i][j-1]+1,rep=D[i-1][j-1]+(same?0:1);D[i][j]=Math.min(del,ins,rep);draw([i,j]);
   $('.lv-note',wg).innerHTML=tx(`„${esc(A.slice(0,i))}“ → „${esc(B.slice(0,j))}“: ${same?`gleicher Buchstabe „${esc(A[i-1])}“ – diagonal übernehmen (${D[i-1][j-1]})`:`min(löschen ${del}, einfügen ${ins}, ersetzen ${rep})`} = <b>${D[i][j]}</b>`,`“${esc(A.slice(0,i))}” → “${esc(B.slice(0,j))}”: ${same?`same letter “${esc(A[i-1])}” – take the diagonal (${D[i-1][j-1]})`:`min(delete ${del}, insert ${ins}, replace ${rep})`} = <b>${D[i][j]}</b>`);if(k>=cells.length)finish();return true};
  const finish=()=>{stop();let i=A.length,j=B.length;const path=[[i,j]],ops=[];while(i>0||j>0){if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(A[i-1]===B[j-1]?0:1)){ops.unshift(A[i-1]===B[j-1]?[`= ${A[i-1]}`,1]:[`${A[i-1]} → ${B[j-1]}`]);i--;j--}else if(i>0&&D[i][j]===D[i-1][j]+1){ops.unshift([`− ${A[i-1]}`]);i--}else{ops.unshift([`+ ${B[j-1]}`]);j--}path.push([i,j])}
   draw(null,path);$('.lv-note',wg).innerHTML=tx(`Distanz: <b>${D[A.length][B.length]}</b>. Rückwärts durch die Tabelle ergibt sich der Weg (grün) und damit die Änderungen:`,`Distance: <b>${D[A.length][B.length]}</b>. Walking back through the table gives the path (green) and thus the edits:`);$('.lv-ops',wg).innerHTML=ops.map(([t,keep])=>`<li class="${keep?'k':''}">${esc(t)}</li>`).join('')};
  const tick=()=>{if(!next())return;timer=setTimeout(tick,+$('.lv-speed',wg).value*2)};
  $('.lv-next',wg).addEventListener('click',()=>{stop();next()});$('.lv-all',wg).addEventListener('click',()=>{stop();while(k<cells.length){const [i,j]=cells[k++];D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(A[i-1]===B[j-1]?0:1))}finish()});
  $('.lv-play',wg).addEventListener('click',()=>{if(timer){stop();return}if(k>=cells.length)reset();$('.lv-play',wg).setAttribute('aria-pressed','true');$('.lv-play span',wg).textContent=tx('Anhalten','Pause');tick()});
  wg.addEventListener('input',e=>{if(e.target.matches('.lv-a,.lv-b'))reset()});reset();return stop;
 },
 links:[wiki('Levenshtein-Distanz','Levenshtein_distance')]},

{id:'coins',cat:'recursion',title:tx('Gierig oder optimal?','Greedy or optimal?'),sub:tx('Wechselgeld mit wenigsten Münzen','Change with the fewest coins'),kind:'sim',keys:'coin change greedy dynamic programming optimal',
 desc:tx('<p>Ein gieriges Verfahren nimmt immer die größte passende Münze. Beim Euro klappt das – bei anderen Münzsystemen nicht. Dynamische Programmierung rechnet für jeden Betrag von 0 aufwärts die beste Lösung aus und findet immer das Optimum.</p>','<p>A greedy method always takes the largest coin that fits. With the euro that works – with other coin systems it doesn’t. Dynamic programming computes the best solution for every amount from 0 upwards and always finds the optimum.</p>'),
 ctl:[{k:'sys',type:'radio',label:tx('Münzsystem','Coin system'),def:'odd',opts:[['eur','Euro (1, 2, 5, 10, 20, 50)'],['odd','1, 3, 4'],['us',tx('US (1, 5, 10, 25)','US (1, 5, 10, 25)')],['seven','1, 7, 10']]},{k:'amt',type:'range',label:tx('Betrag','Amount'),min:1,max:60,def:6}],
 run({sys,amt}){
  const C={eur:[1,2,5,10,20,50],odd:[1,3,4],us:[1,5,10,25],seven:[1,7,10]}[sys];
  const g=[];let r=amt;for(const c of C.slice().reverse())while(r>=c){g.push(c);r-=c}
  const best=[0],from=[0];for(let a=1;a<=amt;a++){best[a]=Infinity;for(const c of C)if(c<=a&&best[a-c]+1<best[a]){best[a]=best[a-c]+1;from[a]=c}}
  const d=[];for(let a=amt;a>0;a-=from[a])d.push(from[a]);
  const coins=l=>`<span class="coins">${l.map(c=>`<span class="coin">${c}</span>`).join('')}</span>`;
  return {v:g.length===d.length?'ok':'bad',verdict:g.length===d.length?tx(`Gierig ist hier optimal: ${g.length} Münzen.`,`Greedy is optimal here: ${g.length} coins.`):tx(`Gierig braucht ${g.length} Münzen, optimal sind ${d.length}.`,`Greedy needs ${g.length} coins, optimal is ${d.length}.`),
   flow:[['info',`${tx('Gierig','Greedy')}: ${coins(g)}`],[g.length===d.length?'ok':'warn',`${tx('Optimal (DP)','Optimal (DP)')}: ${coins(d)}`]],
   html:`<p class="sim-lbl" style="margin:0 0 4px">${tx('DP-Tabelle: wenigste Münzen für jeden Betrag 0 … ','DP table: fewest coins for every amount 0 … ')}${amt}</p><div class="dp-wrap"><table class="dp"><tr><th>${tx('Betrag','amount')}</th>${best.map((_,a)=>`<th>${a}</th>`).join('')}</tr><tr><th>${tx('Münzen','coins')}</th>${best.map((b,a)=>`<td class="${a===amt?'cur':''}">${b}</td>`).join('')}</tr></table></div>`};
 },
 tip:tx('Bei 1, 3, 4 und Betrag 6 nimmt gierig 4 + 1 + 1, optimal ist 3 + 3. Gierige Verfahren sind schnell und oft gut genug – beweisen muss man trotzdem, dass sie optimal sind.','With 1, 3, 4 and amount 6 greedy takes 4 + 1 + 1, optimal is 3 + 3. Greedy methods are fast and often good enough – but you still have to prove they’re optimal.')},

console.log('Object.fromEntries: ' + (performance.now() - t).toFixed(1) + ' ms');`,tx('Jedes Spreaden kopiert alles bisher Gesammelte – unbemerkt O(n²). Ein beliebtes Muster in Reducern und NgRx.','Every spread copies everything collected so far – an unnoticed O(n²). A popular pattern in reducers and NgRx.')]

/* ---------- Engine: Kapitel, Einträge, Widgets ----------
   Jede App liefert APP, CATS und ENTRIES. Ein Eintrag hat id, cat, title, sub, desc, kind und die Daten
   für sein Widget (KINDS[kind]); dazu optional tip, rule, links und keys für die Suche. */
const BY=Object.fromEntries(ENTRIES.map(e=>[e.id,e]));
const CAT_BY=Object.fromEntries(CATS.map(c=>[c.id,c]));
const plain=s=>String(s).replace(/<[^>]+>/g,'');
const nEntries=n=>tx(n===1?'1 Eintrag':`${n} Einträge`,n===1?'1 entry':`${n} entries`);

/* Syntax-Hervorhebung für JS – bewusst klein: Kommentare, Strings, Zahlen, Schlüsselwörter */
const KW=new Set('const let var function return if else for of in while do new class extends this async await try catch finally throw typeof instanceof null undefined true false break continue switch case default delete void yield static super import export from'.split(' '));
function hlJS(src){
  const re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?n?\b)|([A-Za-z_$][\w$]*)/g;
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=m[0];
    out+=m[1]?`<span class="tk-c">${esc(t)}</span>`:m[2]?`<span class="tk-s">${esc(t)}</span>`:m[3]?`<span class="tk-n">${esc(t)}</span>`:KW.has(t)?`<span class="tk-k">${esc(t)}</span>`:esc(t);
    last=re.lastIndex;
  }
  return out+esc(src.slice(last));
}
/* Code mit Markierung: ⟦…⟧ im Text wird hervorgehoben, alles andere escaped */
const mark=s=>esc(s).replace(/⟦([\s\S]*?)⟧/g,'<span class="ca-hl">$1</span>');

/* Wasserfall-Diagramm: rows = [[Label, [[Phase, ms], …], Start-ms]] */
const PH={dns:'DNS',tcp:'TCP',tls:'TLS',wait:tx('Warten','Waiting'),ttfb:tx('Anfrage → erstes Byte','Request → first byte'),dl:'Download',parse:tx('Parsen & Kompilieren','Parse & compile'),exec:tx('Ausführen','Execute'),render:tx('Rendern','Render'),block:tx('Blockiert','Blocked')};
function waterfall(rows,phases){
  const ends=rows.map(([,segs,start=0])=>start+segs.reduce((s,[,ms])=>s+ms,0)),max=Math.max(...ends,1);
  return `<div class="wf" role="img" aria-label="${tx('Zeitachse der Anfragen','Request timeline')}">${rows.map(([lbl,segs,start=0],i)=>{let t=start;return `<div class="wf-row"><span class="wf-lbl">${esc(lbl)}</span><span class="wf-track">${segs.filter(([,ms])=>ms>0).map(([ph,ms])=>{const h=`<span class="wf-seg ph-${ph}" style="left:${t/max*100}%;width:${ms/max*100}%" title="${PH[ph]}: ${Math.round(ms)} ms"></span>`;t+=ms;return h}).join('')}</span><span class="wf-t">${Math.round(ends[i])} ms</span></div>`}).join('')}</div>
  <ul class="wf-legend">${phases.map(p=>`<li><i class="ph-${p}"></i>${PH[p]}</li>`).join('')}</ul>`;
}

/* Werte wie in den DevTools ausgeben: Strings oben ohne, verschachtelt mit Anführungszeichen */
function fmt(v,top=true,depth=0){
  if(v===globalThis)return 'Window {…}';
  if(typeof v==='string')return top?v:`'${v}'`;
  if(v===undefined)return 'undefined';
  if(v===null)return 'null';
  if(typeof v==='number')return Object.is(v,-0)?'-0':String(v);
  if(typeof v==='bigint')return v+'n';
  if(typeof v!=='object'&&typeof v!=='function')return String(v);
  if(typeof v==='function')return `ƒ ${v.name||tx('(anonym)','(anonymous)')}()`;
  if(v instanceof Error)return `${v.name}: ${v.message}`;
  if(v instanceof Promise)return 'Promise {…}';
  if(depth>2)return Array.isArray(v)?'[…]':'{…}';
  if(Array.isArray(v))return `[${v.map(x=>fmt(x,false,depth+1)).join(', ')}]`;
  if(v instanceof Map)return `Map(${v.size}) {${[...v].map(([k,x])=>fmt(k,false,depth+1)+' => '+fmt(x,false,depth+1)).join(', ')}}`;
  if(v instanceof Set)return `Set(${v.size}) {${[...v].map(x=>fmt(x,false,depth+1)).join(', ')}}`;
  if(v instanceof Date)return v.toISOString();
  const proto=Object.getPrototypeOf(v),name=proto&&proto!==Object.prototype&&proto.constructor?proto.constructor.name+' ':'';
  return `${name}{${Object.keys(v).map(k=>`${/^[A-Za-z_$][\w$]*$/.test(k)?k:`'${k}'`}: ${fmt(v[k],false,depth+1)}`).join(', ')}}`;
}

/* Konsole: eine Liste, in die Demos schreiben. token sorgt dafür, dass alte Timer nach einem
   Neustart nicht mehr in die neue Ausgabe schreiben. */
function makeConsole(ol,timed){
  let token=0,t0=0;
  const api={
    reset(){token++;t0=performance.now();ol.innerHTML='';return token},
    add(type,args,tok=token){
      if(tok!==token)return;
      const li=document.createElement('li');li.className='con-'+type;
      if(timed){const t=document.createElement('span');t.className='con-t';t.textContent=Math.round((performance.now()-t0)/10)*10+' ms';li.append(t)}
      const m=document.createElement('span');m.textContent=args.map(a=>fmt(a)).join(' ');li.append(m);
      ol.append(li);
    },
    bound(tok){const a=(type)=>(...x)=>api.add(type,x,tok);return {log:a('log'),info:a('log'),warn:a('warn'),error:a('error')}}
  };
  return api;
}
const consoleHTML=(label=tx('Konsole','Console'))=>`<div class="console"><p class="console-h">${label}</p><ol class="con-lines" role="log" aria-label="${label}" data-empty="${tx('(noch keine Ausgabe)','(no output yet)')}"></ol></div>`;

/* run: Code-Varianten, die wirklich ausgeführt werden. Der Code läuft in einer async-Funktion,
   darum geht await auf oberster Ebene. sleep(ms) steht als Hilfsfunktion bereit. */
KINDS.run={
  html:e=>`${e.vars.length>1?`<fieldset class="ca-vals"><legend class="sr-only">${tx('Variante wählen','Choose a variant')}</legend>${e.vars.map((v,i)=>`<label><input type="radio" name="v-${e.id}" value="${i}"${i===(e.def||0)?' checked':''}>${v[0]}</label>`).join('')}</fieldset>`:''}
  <div class="ca-codebox"><pre class="code" tabindex="0" role="region" aria-label="${tx('Code','Code')}"><code></code></pre>
  <div class="run-bar"><button type="button" class="btn btn-primary btn-sm run-go">${ic('play2')}${tx('Ausführen','Run')}</button><span class="run-hint">${e.timed?tx('Die Zeit links zeigt, wann eine Zeile kam.','The time on the left shows when a line arrived.'):tx('Läuft echt in deinem Browser.','Runs for real in your browser.')}</span></div></div>
  ${consoleHTML()}<p class="ca-note" hidden></p>`,
  init(art,e){
    const con=makeConsole($('.con-lines',art),e.timed);
    let cur=e.def||0;
    const show=i=>{
      cur=i;const [,code,note]=e.vars[i];
      $('pre code',art).innerHTML=hlJS(code);
      const n=$('.ca-note',art);n.hidden=!note;n.innerHTML=note||'';
      run();
    };
    function run(){
      const tok=con.reset(),c=con.bound(tok),code=e.vars[cur][1];
      const sleep=ms=>new Promise(r=>setTimeout(r,ms));
      let fn;
      try{fn=new Function('console','sleep',`return (async()=>{\n${code}\n})()`)}
      catch(err){con.add('error',[`SyntaxError: ${err.message}`],tok);return}
      fn(c,sleep).catch(err=>con.add('error',['Uncaught '+(err instanceof Error?`${err.name}: ${err.message}`:fmt(err,false))],tok));
    }
    art.addEventListener('change',ev=>{if(ev.target.name===`v-${e.id}`)show(+ev.target.value)});
    $('.run-go',art).addEventListener('click',run);
    show(cur);
    return ()=>con.reset();
  }
};

/* trace: Event Loop Schritt für Schritt. Ein Schritt ist [Zeile, Operationen, Erklärung].
   Operationen, durch ; getrennt: s+X / s- (Call Stack), a+X / a-X (Web APIs), m+X / m- (Microtasks),
   t+X / t- (Tasks), r+X / r- (Frame-Callbacks), o X (Konsole). Der Zustand wird für jeden Schritt aus
   allen vorherigen neu berechnet – so geht auch „zurück“ ohne Sonderfälle. */
function trState(e,n){
  const s={stack:[],api:[],micro:[],task:[],raf:[],out:[],line:0,note:e.start||tx('Drück „Weiter“, um den Code Schritt für Schritt laufen zu lassen.','Press “Next” to run the code step by step.'),fresh:new Set()};
  const key={s:'stack',a:'api',m:'micro',t:'task',r:'raf'};
  for(let i=0;i<n;i++){
    const [line,ops,note]=e.steps[i];s.line=line;s.note=note;s.fresh=new Set();
    (ops||'').split(';').map(x=>x.trim()).filter(Boolean).forEach(op=>{
      if(op.startsWith('o ')){s.out.push(op.slice(2));s.fresh.add('out:'+op.slice(2));return}
      const L=s[key[op[0]]],arg=op.slice(2).trim();
      if(op[1]==='+'){L.push(arg);s.fresh.add(key[op[0]]+':'+arg)}
      else if(op[0]==='s')L.pop();
      else if(op[0]==='a'){const i=L.indexOf(arg);if(i>=0)L.splice(i,1)}
      else L.shift();
    });
  }
  return s;
}
KINDS.trace={
  html:e=>{
    const box=(k,cls,title)=>`<section class="tr-box ${cls}" aria-label="${title}"><h3>${title}</h3><ol data-k="${k}"></ol></section>`;
    return `<div class="tr">
    <div class="ca-codebox tr-code"><pre class="code" tabindex="0" role="region" aria-label="Code"><code>${e.code.split('\n').map((l,i)=>`<span class="ln" data-n="${i+1}">${hlJS(l)||' '}</span>`).join('')}</code></pre></div>
    <div class="tr-boxes">${box('stack','tr-stack','Call Stack')}${box('api','tr-api','Web APIs')}${box('micro','tr-micro',tx('Microtask-Queue','Microtask queue'))}${box('task','tr-task',tx('Task-Queue','Task queue'))}${e.raf?box('raf','tr-raf',tx('Vor dem nächsten Frame','Before next frame')):''}${box('out','tr-out',tx('Konsole','Console'))}</div>
    <p class="tr-note" aria-live="polite"></p>
    <div class="tr-bar"><span class="tr-pos"></span><button type="button" class="btn btn-secondary btn-sm tr-reset">${ic('refresh')}${tx('Von vorn','Restart')}</button><button type="button" class="btn btn-secondary btn-sm tr-prev">${ic('back')}${tx('Zurück','Back')}</button><button type="button" class="btn btn-primary btn-sm tr-next">${tx('Weiter','Next')}${ic('fwd')}</button><button type="button" class="btn btn-secondary btn-sm tr-play" aria-pressed="false">${ic('play2')}<span>${tx('Abspielen','Play')}</span></button></div>
    </div>`;
  },
  init(art,e){
    let n=0,timer=null;const N=e.steps.length;
    function draw(){
      const s=trState(e,n);
      $$('.tr-code .ln',art).forEach((l,i)=>l.classList.toggle('is-cur',i+1===s.line));
      ['stack','api','micro','task','raf','out'].forEach(k=>{
        const ol=$(`ol[data-k="${k}"]`,art);if(!ol)return;
        ol.innerHTML=s[k].map(x=>`<li${s.fresh.has(k+':'+x)?' class="is-new"':''}>${esc(x)}</li>`).join('');
      });
      $('.tr-note',art).innerHTML=s.note;
      $('.tr-pos',art).textContent=tx(`Schritt ${n} von ${N}`,`Step ${n} of ${N}`);
      $('.tr-prev',art).disabled=n===0;$('.tr-next',art).disabled=n===N;
      if(n===N)stop();
    }
    function stop(){clearInterval(timer);timer=null;const b=$('.tr-play',art);b.setAttribute('aria-pressed','false');$('span',b).textContent=tx('Abspielen','Play')}
    $('.tr-next',art).addEventListener('click',()=>{if(n<N){n++;draw()}});
    $('.tr-prev',art).addEventListener('click',()=>{if(n>0){n--;draw()}});
    $('.tr-reset',art).addEventListener('click',()=>{stop();n=0;draw()});
    $('.tr-play',art).addEventListener('click',ev=>{
      const b=ev.currentTarget;
      if(timer){stop();return}
      if(n===N)n=0;
      b.setAttribute('aria-pressed','true');$('span',b).textContent=tx('Anhalten','Pause');
      timer=setInterval(()=>{n++;draw()},reducedMotion()?1800:1200);draw();
    });
    draw();
    return ()=>clearInterval(timer);
  }
};

/* sim: Regler setzen, run(state) berechnet Urteil, Nachrichten und Ablauf.
   Rückgabe: {v:'ok'|'bad'|'warn'|'info', verdict, panes:[{t, code}], flow:[[status, html]], html} */
function ctlHTML(e,c){
  const id=`c-${e.id}-${c.k}`;
  if(c.type==='radio')return `<fieldset class="sim-f"><legend>${c.label}</legend><div class="ca-vals">${c.opts.map(([v,l])=>`<label><input type="radio" name="${id}" value="${esc(v)}"${v===c.def?' checked':''}>${l}</label>`).join('')}</div></fieldset>`;
  if(c.type==='checks')return `<fieldset class="sim-f"><legend>${c.label}</legend><div class="sim-checks">${c.opts.map(([v,l,on])=>`<label class="check-row"><input type="checkbox" name="${id}" value="${esc(v)}"${on?' checked':''}>${l}</label>`).join('')}</div></fieldset>`;
  if(c.type==='range')return `<div class="sim-range"><label class="sim-lbl" for="${id}">${c.label}</label><input type="range" id="${id}" name="${id}" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${c.def}"><output for="${id}"></output></div>`;
  if(c.type==='select')return `<div class="field"><label class="sim-lbl" for="${id}">${c.label}</label><select id="${id}" name="${id}">${c.opts.map(([v,l])=>`<option value="${esc(v)}"${v===c.def?' selected':''}>${l}</option>`).join('')}</select></div>`;
  return `<div class="field"><label class="sim-lbl" for="${id}">${c.label}</label><input class="input" id="${id}" name="${id}" value="${esc(c.def||'')}" spellcheck="false" autocomplete="off"></div>`;
}
const VIC={ok:'ok',bad:'xc',warn:'alert',info:'info'};
function simOut(r){
  return `${r.verdict?`<p class="verdict v-${r.v||'info'}">${ic(VIC[r.v||'info'])}<span>${r.verdict}</span></p>`:''}
  ${r.panes&&r.panes.length?`<div class="panes">${r.panes.map(p=>`<figure class="pane"><figcaption>${p.t}</figcaption><pre class="code"><code>${p.code}</code></pre></figure>`).join('')}</div>`:''}
  ${r.flow&&r.flow.length?`<ol class="flow">${r.flow.map(([s,h])=>`<li class="fl-${s}"><span>${h}</span></li>`).join('')}</ol>`:''}
  ${r.html?`<div class="sim-extra">${r.html}</div>`:''}`;
}
KINDS.sim={
  html:e=>`<div class="sim-ctl">${e.ctl.map(c=>ctlHTML(e,c)).join('')}</div><div class="sim-out"></div>`,
  init(art,e){

      const id=`c-${e.id}-${c.k}`;

      if(c.type==='checks')return [c.k,Object.fromEntries(c.opts.map(([v])=>[v,$(`input[name="${id}"][value="${v}"]`,art).checked]))];

    }));
    const out=$('.sim-out',art);
    const upd=()=>{out.innerHTML=simOut(e.run(read()));e.after?.(out)};

};

function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> steht kein Eintrag. Vielleicht hat der Link einen Tippfehler.`,`There is no entry at <code>#${esc(id)}</code>. Maybe the link has a typo.`)}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zum Überblick','Go to overview')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Eintrag suchen','Search entries')}</button></div>
  </div></article>`;
}
function updateTitle(base,sub){
  const c=CAT_BY[base],e=BY[sub];
  document.title=c?(e?`${plain(e.title)} · ${plain(c.title)} · ${APP.name}`:`${plain(c.title)} · ${APP.name}`):base==='start'?`${APP.name} – ${APP.tagline}`:tx(`Nicht gefunden · ${APP.name}`,`Not found · ${APP.name}`);
}
let masterScroll=0,lastId=null;
function route(fromUser){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  let [base,sub='']=id.split(/\/(.*)/);
  // Kurzform #eintrag springt zum Eintrag im richtigen Kapitel
  if(!CAT_BY[base]&&BY[base]){location.replace(`#${BY[base].cat}/${base}`);return}
  shell.dataset.view=overview?'master':'detail';
  let focusEl=null;
  if(overview||base==='start'){base='start';sub='';view.innerHTML=startHTML();cleanup=startInit(view)}
  else if(CAT_BY[base]){
    if(BY[sub]?.cat!==base)sub='';
    view.innerHTML=catHTML(base);cleanup=catInit(view,sub);
    focusEl=sub&&$('#ca-'+sub+'-h',view);
  }
  else{base=null;sub='';view.innerHTML=notFoundHTML(id)}
  withLang(view);
  current=base&&sub?`${base}/${sub}`:base;
  markActive(current,true);updateTitle(base,sub);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{
    if(!sub)detail.scrollTop=0;
    if(focusEl)focusEl.focus({preventScroll:true});else $('#lesson-title').focus({preventScroll:true});
  }
  if(!overview&&current)lastId=current;
}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});

/* ---------- Globale Ereignisse ---------- */
document.addEventListener('click',e=>{if(e.target.closest('#nf-search'))focusSearch()});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Tastenkürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
});

/* ---------- Sprachumschalter ----------
   Ein Link, kein Button: er führt zu einer anderen Adresse (?lang=…) und behält den Hash. Beschriftet in der
   Zielsprache selbst, mit lang-Attribut, damit Screenreader „English“ englisch aussprechen (WCAG 3.1.2). */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}

/* ---------- Start ---------- */
withLang(document);
updateLangLink();
renderList();
route(false);
})();
</script>
</body>
</html>
